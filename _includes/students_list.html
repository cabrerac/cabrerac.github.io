<h2>Test Include Working</h2>
<p>If you can see this, the include is working!</p>
{% assign publications = site.data.publications | sort: 'year' | reverse %}
{% for pub in publications %}
  <div class="publication">
    <b>{{ pub.title }}</b> <a href="{{ site.bibtex.bibfiles[0] }}#{{ pub.bibkey }}" class="bibtex-link" target="_blank">[bibtex]</a>
	<br>
    {{ pub.authors }}
	<br>
    {{ pub.journal }}
	<br>
    {{ pub.year }}
  </div>
{% endfor %}
