{% if site.courses %}
    {% assign visible_courses = site.courses | where: 'visible', true | sort: 'start_date' | reverse %}
    {% if visible_courses.size > 0 %}
        <div class="courses">
            <h1>Courses</h1>
        </div>
    {% else %}
        <div class="courses">
            <h1>Courses</h1>
            <p>No courses available.</p>
        </div>
    {% endif %}
{% endif %}
