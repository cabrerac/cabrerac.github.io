<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {% include head.html %}
  <body class="container {{ page.body_class }}{% if page.sidebar %} with-sidebar{% endif %}">
    <a class="skip-link" href="#content">Skip to content</a>
    {% include header.html %}
    <main id="content" class="main{% if page.sidebar %} main--with-sidebar{% endif %}">
      {% unless page.url == '/' %}
      <h1 class="page-title">{{ page.title }}</h1>
      {% endunless %}
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
