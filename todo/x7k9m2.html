<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .lock { margin: 2rem 0; }
    input[type="password"] { padding: 0.5rem; width: 200px; margin-right: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; margin: 0.25rem 0.25rem 0.25rem 0; }
    .err { color: #c00; margin-top: 0.5rem; }
    .focus-task { margin: 1rem 0; padding: 1rem; background: #f8f8f8; border-radius: 8px; }
    .focus-task h2 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .cat { font-size: 0.85em; color: #666; }
    .subtasks { margin: 0.75rem 0 0 1rem; padding-left: 0.5rem; border-left: 2px solid #ddd; }
    .subtasks ul { list-style: disc; padding-left: 1.25rem; margin: 0.25rem 0; }
    .subtasks li { border: none; padding: 0.15rem 0; }
    .edit-panel { margin: 1rem 0; padding: 1rem; background: #f0f4f8; border-radius: 8px; }
    .edit-panel h3 { margin: 0 0 0.5rem 0; font-size: 0.95rem; }
    .edit-panel input, .edit-panel textarea { width: 100%; max-width: 400px; padding: 0.35rem; margin: 0.25rem 0; }
    .edit-panel ul { list-style: none; padding: 0; }
    .edit-panel li { display: flex; gap: 0.5rem; align-items: center; margin: 0.25rem 0; }
    .edit-panel li input { flex: 1; }
    .full-list { margin-top: 1rem; }
    .full-list ul { list-style: none; padding: 0; }
    .full-list li { padding: 0.35rem 0; border-bottom: 1px solid #eee; }
    .toggle { margin-top: 0.5rem; font-size: 0.9rem; cursor: pointer; color: #06c; }
    .hidden { display: none !important; }
    .save-modal { margin: 1rem 0; padding: 1rem; background: #f0f4f8; border-radius: 8px; }
    .save-modal input { margin: 0.5rem 0; padding: 0.5rem; width: 200px; display: block; }
    .meetings-view { margin-top: 1rem; }
    .meetings-view h2 { font-size: 1rem; margin: 1rem 0 0.5rem 0; }
    .meetings-day-group { margin: 1rem 0; padding: 0.75rem; background: #f5f5f5; border-radius: 6px; }
    .meeting-card { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 6px; border-left: 3px solid #06c; }
    .meeting-card h3 { margin: 0 0 0.5rem 0; font-size: 1rem; }
    .meeting-notes { font-size: 0.9rem; margin: 0.25rem 0; }
    .meeting-notes ul { margin: 0.25rem 0; padding-left: 1.25rem; }
    .meeting-links a { display: block; margin: 0.25rem 0; font-size: 0.9rem; color: #06c; }
    .meeting-actions { margin-top: 0.5rem; }
    .meeting-actions button { margin-right: 0.5rem; font-size: 0.85rem; }
    .yaml-modal { margin: 1rem 0; padding: 1rem; background: #f0f4f8; border-radius: 8px; }
    .yaml-modal h3 { margin: 0 0 0.5rem 0; }
    .yaml-modal textarea { display: block; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <div id="app">
    <div class="lock" id="lock">
      <input type="password" id="pw" placeholder="Password" />
      <button id="unlock">Unlock</button>
      <div class="err" id="err"></div>
    </div>
    <div id="content" class="hidden">
      <div id="focusView">
        <div class="focus-task" id="focusTask">
          <h2 id="focusTitle"></h2>
          <span class="cat" id="focusCat"></span>
          <div class="subtasks" id="focusSubtasks"></div>
        </div>
        <div>
          <button id="btnDone">Done</button>
          <button id="btnSkip">Skip</button>
          <button id="btnShowList">Show list</button>
          <button id="btnMeetings">Meetings</button>
          <button id="btnSave">Save changes</button>
          <button id="btnExportYaml">Download tasks.yaml</button>
        </div>
      </div>
      <div id="meetingsView" class="meetings-view hidden">
        <span class="toggle" id="toggleBackFromMeetings">← Back to focus</span>
        <h2>Meetings (by day)</h2>
        <div id="meetingsByDay"></div>
        <button id="btnAddMeeting">Add meeting</button>
      </div>
      <div id="yamlEditModal" class="yaml-modal hidden">
        <h3 id="yamlEditTitle"></h3>
        <textarea id="yamlEditText" rows="16" style="width:100%; max-width:560px; font-family:monospace; font-size:0.9rem;"></textarea>
        <div class="err" id="yamlEditErr"></div>
        <button id="yamlEditSave">Save</button>
        <button id="yamlEditCancel">Cancel</button>
      </div>
      <div id="saveModal" class="save-modal hidden">
        <p>Password to re-encrypt (same as unlock):</p>
        <input type="password" id="savePassword" placeholder="Password" />
        <button id="btnSaveConfirm">Save</button>
        <button id="btnSaveCancel">Cancel</button>
        <div class="err" id="saveErr"></div>
      </div>
      <div id="editPanel" class="edit-panel hidden">
        <h3>Edit (changes can be saved to encrypted file via Save changes)</h3>
        <label>Title</label>
        <input type="text" id="editTitle" />
        <label>Subtasks (one per line)</label>
        <textarea id="editSubtasks" rows="4"></textarea>
        <button id="btnAddSubtask">Add subtask</button>
        <button id="btnEditTaskYaml">Edit as YAML</button>
        <button id="btnAddNewTask">Add new task to today</button>
        <button id="btnContinue">Continue</button>
      </div>
      <div id="listView" class="full-list hidden">
        <span class="toggle" id="toggleBack">← Back to focus</span>
        <button id="btnAddTaskList" type="button">Add task (YAML)</button>
        <ul id="allList"></ul>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="./decrypt.js"></script>
  <script src="./balance.js"></script>
  <script>
    (function () {
      const CHECK_EMAIL_ID = 'general-check-email';
      const STORAGE_PREFIX = 'plan_';
      const LUNCH_START = 12;
      const LUNCH_END = 14;
      const EOD_START = 17;
      const EOD_END = 18;

      function now() { return new Date(); }
      function dateKey() { const d = now(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
      function inLunch() { const h = now().getHours(); return h >= LUNCH_START && h < LUNCH_END; }
      function inEod() { const h = now().getHours(); return h >= EOD_START && h < EOD_END; }
      function emailWindowKey() {
        if (inLunch()) return STORAGE_PREFIX + 'email_' + dateKey() + '_lunch';
        if (inEod()) return STORAGE_PREFIX + 'email_' + dateKey() + '_eod';
        return null;
      }
      function shouldShowCheckEmailAgain() {
        const k = emailWindowKey();
        if (!k) return false;
        try { return localStorage.getItem(k) !== '1'; } catch (e) { return false; }
      }
      function markCheckEmailShown() {
        const k = emailWindowKey();
        if (k) try { localStorage.setItem(k, '1'); } catch (e) {}
      }

      function getSubtasks(task) {
        const s = task.subtasks;
        if (!s) return [];
        return s.map(function (x) { return typeof x === 'string' ? x : (x.title || ''); });
      }

      function stateFromStorage() {
        try {
          const raw = sessionStorage.getItem(STORAGE_PREFIX + 'state');
          if (!raw) return null;
          const s = JSON.parse(raw);
          if (s.dateKey !== dateKey()) return null;
          return s;
        } catch (e) { return null; }
      }
      function saveState(state) {
        try {
          const copy = { dateKey: dateKey(), tasks: state.tasks, venues: state.venues, meetings: state.meetings || [], doneIds: Array.from(state.doneIds), queue: state.queue, queueIndex: state.queueIndex };
          sessionStorage.setItem(STORAGE_PREFIX + 'state', JSON.stringify(copy));
        } catch (e) {}
      }

      let state = null;

      function findCheckEmail(tasks) {
        return tasks.find(function (t) { return (t.id && t.id === CHECK_EMAIL_ID) || (t.title && t.title.toLowerCase().indexOf('check email') !== -1); }) || null;
      }

      function buildQueue(todayOrdered, checkEmail) {
        let q = todayOrdered.slice();
        if (checkEmail && q.length && (q[0].id !== checkEmail.id && q[0].title !== checkEmail.title)) {
          q = [checkEmail].concat(q.filter(function (t) { return t.id !== checkEmail.id; }));
        }
        return q;
      }

      function getNextTask() {
        if (!state || !state.queue.length) return null;
        const checkEmail = findCheckEmail(state.tasks);
        if (checkEmail && shouldShowCheckEmailAgain()) return { task: checkEmail, fromWindow: true };
        let idx = state.queueIndex;
        while (idx < state.queue.length) {
          const t = state.queue[idx];
          if (!state.doneIds.has(t.id || t.title)) return { task: t, fromWindow: false, queueIndex: idx };
          idx++;
        }
        state.queueIndex = state.queue.length;
        return null;
      }

      function renderFocus(task) {
        document.getElementById('focusTitle').textContent = task.title || task.id || '';
        document.getElementById('focusCat').textContent = task.category ? ' · ' + task.category : '';
        const subs = getSubtasks(task);
        const el = document.getElementById('focusSubtasks');
        if (subs.length) {
          el.innerHTML = '<ul>' + subs.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ul>';
          el.classList.remove('hidden');
        } else {
          el.innerHTML = '';
          el.classList.add('hidden');
        }
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function showFocus() {
        document.getElementById('focusView').classList.remove('hidden');
        document.getElementById('editPanel').classList.add('hidden');
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('meetingsView').classList.add('hidden');
      }

      function showEdit(currentTask, fromWindow, action, queueIndex) {
        document.getElementById('focusView').classList.add('hidden');
        document.getElementById('editPanel').classList.remove('hidden');
        document.getElementById('editTitle').value = currentTask.title || currentTask.id || '';
        document.getElementById('editSubtasks').value = getSubtasks(currentTask).join('\n');
        document.getElementById('editPanel').dataset.taskId = currentTask.id || currentTask.title || '';
        document.getElementById('editPanel').dataset.fromWindow = fromWindow ? '1' : '0';
        document.getElementById('editPanel').dataset.action = action || 'skip';
        document.getElementById('editPanel').dataset.queueIndex = String(queueIndex != null ? queueIndex : -1);
      }

      function applyEdit() {
        const id = document.getElementById('editPanel').dataset.taskId;
        const fromWindow = document.getElementById('editPanel').dataset.fromWindow === '1';
        const action = document.getElementById('editPanel').dataset.action;
        const queueIndex = parseInt(document.getElementById('editPanel').dataset.queueIndex, 10);
        const title = document.getElementById('editTitle').value.trim();
        const subtasksText = document.getElementById('editSubtasks').value.trim();
        const subtasks = subtasksText ? subtasksText.split('\n').map(function (s) { return s.trim(); }).filter(Boolean) : [];

        const task = state.tasks.find(function (t) { return (t.id || t.title) === id; });
        if (task) {
          task.title = title || task.title;
          task.subtasks = subtasks.length ? subtasks : undefined;
        }
        const inQueue = state.queue.find(function (t) { return (t.id || t.title) === id; });
        if (inQueue) {
          inQueue.title = title || inQueue.title;
          inQueue.subtasks = subtasks.length ? subtasks : undefined;
        }
        if (fromWindow) markCheckEmailShown();
        if (action === 'done' && !isNaN(queueIndex) && queueIndex >= 0 && state.queue[queueIndex])
          state.doneIds.add(state.queue[queueIndex].id || state.queue[queueIndex].title);
        saveState(state);
        goNext();
      }

      function goNext() {
        document.getElementById('editPanel').classList.add('hidden');
        showFocus();
        const next = getNextTask();
        if (next) {
          if (next.queueIndex !== undefined) state.queueIndex = next.queueIndex + 1;
          renderFocus(next.task);
        } else {
          document.getElementById('focusTitle').textContent = 'No more tasks for now';
          document.getElementById('focusCat').textContent = 'Refresh to reset or update your list.';
          document.getElementById('focusSubtasks').innerHTML = '<button type="button" id="btnShowList2">Show list</button>';
          document.getElementById('focusSubtasks').classList.remove('hidden');
          document.getElementById('focusSubtasks').querySelector('#btnShowList2').onclick = showList;
        }
        saveState(state);
      }

      function showList() {
        document.getElementById('focusView').classList.add('hidden');
        document.getElementById('editPanel').classList.add('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('meetingsView').classList.add('hidden');
        const list = state.queue.filter(function (t) { return !state.doneIds.has(t.id || t.title); });
        document.getElementById('allList').innerHTML = list.map(function (t) {
          const cat = t.category ? '<span class="cat"> ' + t.category + '</span>' : '';
          const subs = getSubtasks(t);
          const subHtml = subs.length ? '<ul>' + subs.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ul>' : '';
          const tid = (t.id || t.title || '').replace(/"/g, '&quot;');
          return '<li data-task-id="' + tid + '"><strong>' + escapeHtml(t.title || t.id || '') + '</strong>' + cat + subHtml + '<span class="meeting-actions"><button type="button" class="btn-edit-task-yaml">Edit YAML</button><button type="button" class="btn-remove-task">Remove</button></span></li>';
        }).join('');
        document.getElementById('allList').querySelectorAll('.btn-edit-task-yaml').forEach(function (btn) {
          btn.onclick = function () {
            const li = btn.closest('li');
            const id = li && li.dataset.taskId;
            const task = state.tasks.find(function (t) { return (t.id || t.title) === id; });
            if (task) openYamlEdit('task', task, id);
          };
        });
        document.getElementById('allList').querySelectorAll('.btn-remove-task').forEach(function (btn) {
          btn.onclick = function () {
            const li = btn.closest('li');
            const id = li && li.dataset.taskId;
            if (!id || !confirm('Remove this task from the list?')) return;
            state.tasks = state.tasks.filter(function (t) { return (t.id || t.title) !== id; });
            state.queue = state.queue.filter(function (t) { return (t.id || t.title) !== id; });
            state.doneIds.delete(id);
            saveState(state);
            showList();
          };
        });
      }

      function meetingDayKey(m) {
        const n = m.next;
        if (!n) return 'no-date';
        const d = new Date(n);
        return isNaN(d.getTime()) ? String(n) : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function renderMeetingsView() {
        const meetings = state.meetings || [];
        const byDay = {};
        meetings.forEach(function (m) {
          const k = meetingDayKey(m);
          if (!byDay[k]) byDay[k] = [];
          byDay[k].push(m);
        });
        const days = Object.keys(byDay).sort();
        let html = '';
        days.forEach(function (day) {
          const list = byDay[day];
          html += '<div class="meetings-day-group"><h2>' + (day === 'no-date' ? 'No date' : day) + '</h2>';
          list.forEach(function (m) {
            const pre = (m['pre-notes'] || m.pre_notes || m.preNotes || []);
            const post = (m['post-notes'] || m.post_notes || m.postNotes || []);
            const links = m.links || [];
            const linksHtml = links.length ? '<div class="meeting-links">' + links.map(function (url) { return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>'; }).join('') + '</div>' : '';
            html += '<div class="meeting-card" data-meeting-id="' + escapeHtml(m.id || '') + '">';
            html += '<h3>' + escapeHtml(m.title || m.id || '') + '</h3>';
            if (pre.length) html += '<div class="meeting-notes"><strong>Pre:</strong><ul>' + pre.map(function (n) { return '<li>' + escapeHtml(n) + '</li>'; }).join('') + '</ul></div>';
            if (post.length) html += '<div class="meeting-notes"><strong>Post:</strong><ul>' + post.map(function (n) { return '<li>' + escapeHtml(n) + '</li>'; }).join('') + '</ul></div>';
            html += linksHtml;
            html += '<div class="meeting-actions"><button type="button" class="btn-edit-meeting-yaml">Edit YAML</button><button type="button" class="btn-remove-meeting">Remove</button></div></div>';
          });
          html += '</div>';
        });
        if (!days.length) html = '<p>No meetings.</p>';
        document.getElementById('meetingsByDay').innerHTML = html;
        document.getElementById('meetingsByDay').querySelectorAll('.btn-edit-meeting-yaml').forEach(function (btn) {
          btn.onclick = function () {
            const card = btn.closest('.meeting-card');
            const id = card && card.dataset.meetingId;
            const meeting = (state.meetings || []).find(function (m) { return m.id === id; });
            if (meeting) openYamlEdit('meeting', meeting, id);
          };
        });
        document.getElementById('meetingsByDay').querySelectorAll('.btn-remove-meeting').forEach(function (btn) {
          btn.onclick = function () {
            const card = btn.closest('.meeting-card');
            const id = card && card.dataset.meetingId;
            if (!id || !confirm('Remove this meeting?')) return;
            state.meetings = (state.meetings || []).filter(function (m) { return m.id !== id; });
            saveState(state);
            renderMeetingsView();
          };
        });
      }

      function showMeetings() {
        document.getElementById('focusView').classList.add('hidden');
        document.getElementById('editPanel').classList.add('hidden');
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('meetingsView').classList.remove('hidden');
        renderMeetingsView();
      }

      function openYamlEdit(kind, item, id) {
        document.getElementById('yamlEditModal').classList.remove('hidden');
        document.getElementById('yamlEditTitle').textContent = kind === 'meeting' ? ('Edit meeting: ' + (item.title || item.id)) : ('Edit task: ' + (item.title || item.id));
        document.getElementById('yamlEditErr').textContent = '';
        try {
          document.getElementById('yamlEditText').value = jsyaml.dump(item, { lineWidth: -1 });
        } catch (e) {
          document.getElementById('yamlEditText').value = jsyaml.dump(item, { lineWidth: -1, noRefs: true });
        }
        document.getElementById('yamlEditModal').dataset.kind = kind;
        document.getElementById('yamlEditModal').dataset.id = id || '';
      }

      function closeYamlEdit() {
        document.getElementById('yamlEditModal').classList.add('hidden');
      }

      function saveYamlEdit() {
        const kind = document.getElementById('yamlEditModal').dataset.kind;
        const id = document.getElementById('yamlEditModal').dataset.id;
        const text = document.getElementById('yamlEditText').value.trim();
        document.getElementById('yamlEditErr').textContent = '';
        try {
          const parsed = jsyaml.load(text);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            document.getElementById('yamlEditErr').textContent = 'Invalid YAML: expected a single object.';
            return;
          }
          if (kind === 'meeting') {
            const idx = (state.meetings || []).findIndex(function (m) { return m.id === id; });
            if (idx >= 0) {
              state.meetings[idx] = parsed;
            } else {
              state.meetings = state.meetings || [];
              state.meetings.push(parsed);
            }
            saveState(state);
            renderMeetingsView();
          } else {
            const taskIdx = state.tasks.findIndex(function (t) { return (t.id || t.title) === id; });
            if (taskIdx >= 0) {
              state.tasks[taskIdx] = parsed;
              const qIdx = state.queue.findIndex(function (t) { return (t.id || t.title) === id; });
              if (qIdx >= 0) state.queue[qIdx] = parsed;
            } else {
              state.tasks.push(parsed);
              state.queue.push(parsed);
            }
            saveState(state);
            const editPanel = document.getElementById('editPanel');
            if (editPanel && !editPanel.classList.contains('hidden') && editPanel.dataset.taskId === (parsed.id || parsed.title)) {
              document.getElementById('editTitle').value = parsed.title || parsed.id || '';
              document.getElementById('editSubtasks').value = getSubtasks(parsed).join('\n');
            }
            if (!document.getElementById('listView').classList.contains('hidden')) showList();
          }
          closeYamlEdit();
        } catch (e) {
          document.getElementById('yamlEditErr').textContent = e.message || 'Invalid YAML.';
        }
      }

      document.getElementById('btnMeetings').onclick = showMeetings;
      document.getElementById('toggleBackFromMeetings').onclick = showFocus;
      document.getElementById('yamlEditSave').onclick = saveYamlEdit;
      document.getElementById('yamlEditCancel').onclick = closeYamlEdit;

      document.getElementById('btnAddMeeting').onclick = function () {
        const template = { id: 'meeting-' + Date.now(), title: 'New meeting', category: 'meeting', next: new Date().toISOString().slice(0, 10), tasks: [], status: 'upcoming', links: [], 'pre-notes': [], 'post-notes': [] };
        openYamlEdit('meeting', template, null);
      };
      document.getElementById('btnAddTaskList').onclick = function () {
        const template = { id: 'session-' + Date.now(), title: 'New task', category: 'admin', reward: 'medium', urgency: 'flexible' };
        openYamlEdit('task', template, null);
      };

      document.getElementById('toggleBack').onclick = function () {
        document.getElementById('listView').classList.add('hidden');
        showFocus();
      };

      document.getElementById('btnContinue').onclick = applyEdit;

      document.getElementById('btnAddNewTask').onclick = function () {
        const title = prompt('New task title');
        if (!title || !title.trim()) return;
        const newTask = { id: 'session-' + Date.now(), title: title.trim(), category: 'admin' };
        state.tasks.push(newTask);
        state.queue.push(newTask);
        saveState(state);
      };

      document.getElementById('unlock').addEventListener('click', run);
      document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

      async function run() {
        const password = document.getElementById('pw').value.trim();
        document.getElementById('err').textContent = '';
        if (!password) { document.getElementById('err').textContent = 'Enter password.'; return; }
        try {
          const res = await fetch('./data.enc');
          if (!res.ok) throw new Error('Could not load data.');
          const payloadStr = await res.text();
          const decryptFn = (typeof self !== 'undefined' && self.TODO_decrypt) ? self.TODO_decrypt.decrypt : null;
          if (!decryptFn) throw new Error('Decrypt not available.');
          const plaintext = await decryptFn(payloadStr, password);
          const data = jsyaml.load(plaintext);
          if (!data) throw new Error('Invalid data.');
          const tasks = Array.isArray(data.tasks) ? data.tasks : [];
          const meetings = Array.isArray(data.meetings) ? data.meetings : [];

          let today = [];
          if (tasks.length) {
            const balanceFn = (typeof self !== 'undefined' && self.TODO_balance) ? self.TODO_balance.balance : null;
            if (balanceFn) {
              const out = balanceFn({ tasks: tasks, venues: data.venues || [] }, { maxTotal: 8, daysAhead: 7 });
              today = out.today || [];
            }
            const checkEmail = findCheckEmail(tasks);
            if (checkEmail && today.length) {
              today = [checkEmail].concat(today.filter(function (t) { return t.id !== checkEmail.id && t.title !== checkEmail.title; }));
            }
          }
          const queue = buildQueue(today, findCheckEmail(tasks));
          state = {
            tasks: JSON.parse(JSON.stringify(tasks)),
            venues: data.venues || [],
            meetings: JSON.parse(JSON.stringify(meetings)),
            doneIds: new Set(),
            queue: queue,
            queueIndex: 0
          };
          const restored = stateFromStorage();
          if (restored && (restored.tasks || restored.meetings)) {
            if (restored.tasks) state.tasks = restored.tasks;
            if (restored.meetings) state.meetings = restored.meetings;
            state.doneIds = new Set(restored.doneIds || []);
            if (restored.queue) state.queue = restored.queue;
            state.queueIndex = restored.queueIndex != null ? restored.queueIndex : 0;
          }
          saveState(state);

          document.getElementById('lock').classList.add('hidden');
          document.getElementById('content').classList.remove('hidden');

          const next = getNextTask();
          if (next) {
            if (next.queueIndex !== undefined) state.queueIndex = next.queueIndex;
            renderFocus(next.task);
          } else {
            document.getElementById('focusTitle').textContent = 'No tasks for now';
            document.getElementById('focusCat').textContent = '';
            document.getElementById('focusSubtasks').innerHTML = '';
            document.getElementById('focusSubtasks').classList.add('hidden');
          }
        } catch (e) {
          document.getElementById('err').textContent = e.message || 'Error.';
        }
      }

      document.getElementById('btnDone').onclick = function () {
        const next = getNextTask();
        if (!next) return;
        showEdit(next.task, next.fromWindow, 'done', next.queueIndex);
      };

      document.getElementById('btnSkip').onclick = function () {
        const next = getNextTask();
        if (!next) return;
        if (next.queueIndex !== undefined && next.queueIndex < state.queue.length) state.queueIndex = next.queueIndex + 1;
        showEdit(next.task, next.fromWindow, 'skip', next.queueIndex);
      };

      document.getElementById('btnShowList').onclick = showList;

      document.getElementById('btnAddSubtask').onclick = function () {
        const ta = document.getElementById('editSubtasks');
        ta.value = (ta.value.trim() ? ta.value + '\n' : '') + 'New subtask';
      };
      document.getElementById('btnEditTaskYaml').onclick = function () {
        const id = document.getElementById('editPanel').dataset.taskId;
        const task = state.tasks.find(function (t) { return (t.id || t.title) === id; });
        if (task) openYamlEdit('task', task, id);
      };

      document.getElementById('btnSave').onclick = function () {
        if (!state) return;
        document.getElementById('saveModal').classList.remove('hidden');
        document.getElementById('saveErr').textContent = '';
        document.getElementById('savePassword').value = '';
      };
      document.getElementById('btnSaveCancel').onclick = function () {
        document.getElementById('saveModal').classList.add('hidden');
      };
      document.getElementById('btnSaveConfirm').onclick = saveChanges;

      async function saveChanges() {
        const password = document.getElementById('savePassword').value.trim();
        document.getElementById('saveErr').textContent = '';
        if (!password) { document.getElementById('saveErr').textContent = 'Enter password.'; return; }
        const encryptFn = (typeof self !== 'undefined' && self.TODO_decrypt && self.TODO_decrypt.encrypt) ? self.TODO_decrypt.encrypt : null;
        if (!encryptFn) { document.getElementById('saveErr').textContent = 'Encrypt not available.'; return; }
        try {
          const data = { venues: state.venues || [], meetings: state.meetings || [], tasks: state.tasks };
          const yamlStr = jsyaml.dump(data, { lineWidth: -1 });
          const payload = await encryptFn(yamlStr, password);
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/octet-stream' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'data.enc';
          a.click();
          URL.revokeObjectURL(a.href);
          document.getElementById('saveModal').classList.add('hidden');
        } catch (e) {
          document.getElementById('saveErr').textContent = e.message || 'Error.';
        }
      }

      document.getElementById('btnExportYaml').onclick = function () {
        if (!state) return;
        const data = { venues: state.venues || [], meetings: state.meetings || [], tasks: state.tasks };
        const yamlStr = jsyaml.dump(data, { lineWidth: -1 });
        const blob = new Blob([yamlStr], { type: 'application/x-yaml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tasks.yaml';
        a.click();
        URL.revokeObjectURL(a.href);
      };
    })();
  </script>
</body>
</html>
