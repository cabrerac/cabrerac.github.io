<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Orchestrated batch workflow</text>

  <!-- Scheduler -->
  <rect x="60" y="70" width="150" height="64" rx="8" fill="#fbe5d6" stroke="#c55a11" stroke-width="2"/>
  <text x="135" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Scheduler</text>
  <text x="135" y="118" text-anchor="middle" font-size="11" fill="#5a6b7b">cron / event trigger</text>

  <!-- Orchestrator box -->
  <rect x="250" y="56" width="420" height="280" rx="10" fill="#f6f8fa" stroke="#2f5597" stroke-width="2"/>
  <text x="460" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5597">Orchestrator (Prefect / Airflow / Dagster)</text>

  <!-- DAG tasks -->
  <rect x="290" y="110" width="120" height="52" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="#1f2d3d">Extract</text>

  <rect x="400" y="110" width="120" height="52" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="460" y="142" text-anchor="middle" font-size="13" fill="#1f2d3d">Transform</text>

  <rect x="510" y="110" width="120" height="52" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="570" y="142" text-anchor="middle" font-size="13" fill="#1f2d3d">Load</text>

  <rect x="455" y="210" width="120" height="52" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="515" y="242" text-anchor="middle" font-size="13" fill="#1f2d3d">Validate</text>

  <g stroke="#5a6b7b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="215" y1="102" x2="288" y2="136"/>
    <line x1="410" y1="136" x2="398" y2="136"/>
    <line x1="520" y1="136" x2="508" y2="136"/>
    <line x1="570" y1="162" x2="515" y2="208"/>
  </g>

  <!-- Observability -->
  <rect x="290" y="290" width="340" height="32" rx="5" fill="#e2efda" stroke="#548235"/>
  <text x="460" y="311" text-anchor="middle" font-size="12" fill="#1f2d3d">Run logs, retries, failure alerts</text>

  <!-- Audit sidecar -->
  <rect x="710" y="110" width="170" height="150" rx="8" fill="#efe8f5" stroke="#7030a0" stroke-width="2"/>
  <text x="795" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#7030a0">Governance</text>
  <text x="725" y="168" font-size="12" fill="#1f2d3d">audit.jsonl</text>
  <text x="725" y="192" font-size="12" fill="#1f2d3d">schema contract</text>
  <text x="725" y="216" font-size="12" fill="#1f2d3d">lineage metadata</text>
  <line x1="630" y1="136" x2="708" y2="160" stroke="#7030a0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="575" y1="236" x2="708" y2="200" stroke="#7030a0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="340" y="380" width="240" height="64" rx="8" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="460" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#548235">Curated Parquet</text>
  <text x="460" y="428" text-anchor="middle" font-size="11" fill="#5a6b7b">ready for analytics (L6)</text>
  <line x1="515" y1="262" x2="460" y2="378" stroke="#548235" stroke-width="2" marker-end="url(#arr)"/>

  <text x="460" y="472" text-anchor="middle" font-size="14" fill="#5a6b7b">Declare steps once. Run locally today, on schedule in production.</text>
</svg>
