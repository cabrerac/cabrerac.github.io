<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#548235"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7030a0"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Orchestrated batch workflow</text>

  <!-- Scheduler -->
  <rect x="60" y="70" width="150" height="64" rx="8" fill="#fbe5d6" stroke="#c55a11" stroke-width="2"/>
  <text x="135" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d3d">Scheduler</text>
  <text x="135" y="118" text-anchor="middle" font-size="11" fill="#5a6b7b">cron / event trigger</text>

  <!-- Orchestrator box -->
  <rect x="240" y="52" width="440" height="292" rx="10" fill="#f6f8fa" stroke="#2f5597" stroke-width="2"/>
  <text x="460" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5597">Orchestrator (Prefect / Airflow / Dagster)</text>

  <!-- DAG tasks (non-overlapping, left-to-right) -->
  <rect x="265" y="105" width="92" height="50" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="311" y="136" text-anchor="middle" font-size="13" fill="#1f2d3d">Extract</text>

  <rect x="382" y="105" width="92" height="50" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="428" y="136" text-anchor="middle" font-size="13" fill="#1f2d3d">Transform</text>

  <rect x="499" y="105" width="92" height="50" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="545" y="136" text-anchor="middle" font-size="13" fill="#1f2d3d">Load</text>

  <rect x="499" y="192" width="92" height="50" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="545" y="223" text-anchor="middle" font-size="13" fill="#1f2d3d">Validate</text>

  <!-- Observability -->
  <rect x="265" y="272" width="326" height="32" rx="5" fill="#e2efda" stroke="#548235"/>
  <text x="428" y="293" text-anchor="middle" font-size="12" fill="#1f2d3d">Run logs, retries, failure alerts</text>

  <!-- Governance sidecar -->
  <rect x="710" y="105" width="170" height="150" rx="8" fill="#efe8f5" stroke="#7030a0" stroke-width="2"/>
  <text x="795" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#7030a0">Governance</text>
  <text x="725" y="163" font-size="12" fill="#1f2d3d">audit.jsonl</text>
  <text x="725" y="187" font-size="12" fill="#1f2d3d">schema contract</text>
  <text x="725" y="211" font-size="12" fill="#1f2d3d">lineage metadata</text>

  <!-- Output -->
  <rect x="340" y="385" width="240" height="64" rx="8" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="460" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#548235">Curated Parquet</text>
  <text x="460" y="433" text-anchor="middle" font-size="11" fill="#5a6b7b">ready for analytics (L6)</text>

  <!-- Main flow arrows (orthogonal, left-to-right) -->
  <g stroke="#5a6b7b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <!-- Scheduler → Extract -->
    <path d="M 210 102 H 248 V 130 H 265"/>
    <!-- Extract → Transform -->
    <path d="M 357 130 H 382"/>
    <!-- Transform → Load -->
    <path d="M 474 130 H 499"/>
    <!-- Load → Validate -->
    <path d="M 545 155 V 192"/>
  </g>

  <!-- Validate → Curated Parquet -->
  <path d="M 545 242 V 355 H 460 V 385" stroke="#548235" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- Governance (dashed, orthogonal) -->
  <g stroke="#7030a0" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arr-purple)">
    <!-- Load → Governance -->
    <path d="M 591 130 H 655 V 155 H 710"/>
    <!-- Validate → Governance -->
    <path d="M 591 217 H 675 V 195 H 710"/>
  </g>

  <text x="460" y="472" text-anchor="middle" font-size="14" fill="#5a6b7b">Declare steps once. Run locally today, on schedule in production.</text>
</svg>
