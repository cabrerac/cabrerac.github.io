  <text x="255" y="296" class="cell">1</text>
  <rect x="310" y="256" width="110" height="62" fill="#f4f6f8"/>
  <text x="365" y="296" class="cell">0</text>
  <rect x="420" y="256" width="110" height="62" fill="#f4f6f8"/>
