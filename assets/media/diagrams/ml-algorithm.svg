<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="700" height="300" fill="#f5f5f5"/>
    
    <!-- Title -->
    <text x="350" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Machine Learning Algorithm</text>
    
    <!-- Input Data Box -->
    <rect x="50" y="100" width="150" height="100" rx="10" fill="#4CAF50" stroke="#333" stroke-width="2"/>
    <text x="125" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">Training Data</text>
    
    <!-- Algorithm Box -->
    <rect x="275" y="100" width="150" height="100" rx="10" fill="#2196F3" stroke="#333" stroke-width="2"/>
    <text x="350" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">ML Algorithm</text>
    
    <!-- Model Box -->
    <rect x="500" y="100" width="150" height="100" rx="10" fill="#FF9800" stroke="#333" stroke-width="2"/>
    <text x="575" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">ML Model</text>
    
    <!-- Arrows -->
    <path d="M200 150 L275 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M425 150 L500 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Algorithm Types -->
    <text x="350" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" style="font-weight: bold">Linear Regression</text>
    <text x="350" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" style="font-weight: bold">Decision Trees</text>
    <text x="350" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" style="font-weight: bold">Neural Networks</text>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg> 