<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" fill="#224466" font-size="24" font-weight="bold">
        Combinatorial Explosion
    </text>
    
    <!-- Subtitle -->
    <text x="400" y="70" text-anchor="middle" fill="#224466" font-size="18">
        How the number of possibilities grows exponentially with each decision point
    </text>

    <!-- Levels -->
    <!-- Level 1 - Root Node -->
    <circle cx="400" cy="120" r="24" fill="#f0f0f0" stroke="#224466" stroke-width="3"/>
    <text x="400" y="125" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">1</text>
    
    <!-- Level 2 - 2 Nodes -->
    <circle cx="250" cy="200" r="20" fill="#f0f0f0" stroke="#224466" stroke-width="2.5"/>
    <text x="250" y="205" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">2</text>
    
    <circle cx="550" cy="200" r="20" fill="#f0f0f0" stroke="#224466" stroke-width="2.5"/>
    <text x="550" y="205" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">2</text>

    <!-- Level 3 - 4 Nodes -->
    <circle cx="175" cy="280" r="16" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="175" y="284" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">4</text>
    
    <circle cx="325" cy="280" r="16" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="325" y="284" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">4</text>
    
    <circle cx="475" cy="280" r="16" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="475" y="284" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">4</text>
    
    <circle cx="625" cy="280" r="16" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="625" y="284" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">4</text>

    <!-- Level 4 - 8 Nodes (showing partial nodes with ellipsis) -->
    <circle cx="125" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="125" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>
    
    <circle cx="175" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="175" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>
    
    <text x="225" cy="350" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    
    <circle cx="275" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="275" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>

    <circle cx="375" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="375" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>
    
    <text x="425" y="350" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    
    <circle cx="525" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="525" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>
    
    <circle cx="625" cy="350" r="12" fill="#f0f0f0" stroke="#224466" stroke-width="1.5"/>
    <text x="625" y="353" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">8</text>
    
    <text x="675" y="350" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>

    <!-- Level 5 - represented by many dots -->
    <text x="200" y="410" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    <text x="300" y="410" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    <text x="400" y="410" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    <text x="500" y="410" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>
    <text x="600" y="410" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">...</text>

    <!-- Connections -->
    <!-- Level 1 to Level 2 -->
    <line x1="400" y1="144" x2="250" y2="185" stroke="#0E73B8" stroke-width="2.5"/>
    <line x1="400" y1="144" x2="550" y2="185" stroke="#0E73B8" stroke-width="2.5"/>

    <!-- Level 2 to Level 3 -->
    <line x1="250" y1="220" x2="175" y2="265" stroke="#0E73B8" stroke-width="2"/>
    <line x1="250" y1="220" x2="325" y2="265" stroke="#0E73B8" stroke-width="2"/>
    <line x1="550" y1="220" x2="475" y2="265" stroke="#0E73B8" stroke-width="2"/>
    <line x1="550" y1="220" x2="625" y2="265" stroke="#0E73B8" stroke-width="2"/>

    <!-- Level 3 to Level 4 (partial) -->
    <line x1="175" y1="296" x2="125" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    <line x1="175" y1="296" x2="175" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    <line x1="175" y1="296" x2="225" y2="338" stroke="#0E73B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <line x1="325" y1="296" x2="275" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    <line x1="325" y1="296" x2="325" y2="338" stroke="#0E73B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="325" y1="296" x2="375" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    
    <line x1="475" y1="296" x2="425" y2="338" stroke="#0E73B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="475" y1="296" x2="475" y2="338" stroke="#0E73B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="475" y1="296" x2="525" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    
    <line x1="625" y1="296" x2="625" y2="338" stroke="#0E73B8" stroke-width="1.5"/>
    <line x1="625" y1="296" x2="675" y2="338" stroke="#0E73B8" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Level counts labels -->
    <rect x="15" y="120" width="100" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#224466" stroke-width="1"/>
    <text x="65" y="140" text-anchor="middle" fill="#224466" font-size="16">Level 1: 1</text>
    
    <rect x="15" y="200" width="100" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#224466" stroke-width="1"/>
    <text x="65" y="220" text-anchor="middle" fill="#224466" font-size="16">Level 2: 2</text>
    
    <rect x="15" y="280" width="100" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#224466" stroke-width="1"/>
    <text x="65" y="300" text-anchor="middle" fill="#224466" font-size="16">Level 3: 4</text>
    
    <rect x="15" y="360" width="100" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#224466" stroke-width="1"/>
    <text x="65" y="380" text-anchor="middle" fill="#224466" font-size="16">Level 4: 8</text>
    
    <rect x="15" y="420" width="100" height="30" rx="5" ry="5" fill="#f0f0f0" stroke="#224466" stroke-width="1"/>
    <text x="65" y="440" text-anchor="middle" fill="#224466" font-size="16">Level 5: 16</text>

    <!-- Formula -->
    <rect x="250" y="440" width="300" height="40" rx="10" ry="10" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="400" y="455" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">
        Total possibilities = b^d
    </text>
    <text x="400" y="470" text-anchor="middle" fill="#224466" font-size="16">
        (b: branching factor, d: depth)
    </text>
</svg> 