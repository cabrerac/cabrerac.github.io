<?xml version="1.0" encoding="UTF-8"?>
<svg width="650" height="420" viewBox="0 0 650 420" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect x="0" y="0" width="650" height="420" fill="white"/>
  <!-- Black border for plot area -->
  <rect x="70" y="30" width="510" height="360" fill="none" stroke="black" stroke-width="2"/>

  <!-- Colored lines through the origin -->
  <g stroke-width="5">
    <line x1="70" y1="390" x2="580" y2="70" stroke="#ff7f0e"/>
    <line x1="70" y1="70" x2="580" y2="390" stroke="#1f77b4"/>
    <line x1="70" y1="130" x2="580" y2="330" stroke="#2ca02c"/>
    <line x1="70" y1="330" x2="580" y2="130" stroke="#d62728"/>
    <line x1="70" y1="180" x2="580" y2="280" stroke="#9467bd"/>
    <line x1="70" y1="280" x2="580" y2="180" stroke="#8c564b"/>
    <line x1="70" y1="100" x2="580" y2="360" stroke="#e377c2"/>
    <line x1="70" y1="360" x2="580" y2="100" stroke="#7f7f7f"/>
    <line x1="70" y1="210" x2="580" y2="250" stroke="#bcbd22"/>
    <line x1="70" y1="250" x2="580" y2="210" stroke="#17becf"/>
  </g>

  <!-- Axes -->
  <line x1="70" y1="230" x2="580" y2="230" stroke="black" stroke-width="2"/>
  <line x1="325" y1="30" x2="325" y2="390" stroke="black" stroke-width="2"/>

  <!-- Axis labels (LaTeX style) -->
  <text x="600" y="240" font-size="36" font-family="Times New Roman, serif" font-style="italic">x</text>
  <text x="300" y="60" font-size="36" font-family="Times New Roman, serif" font-style="italic">y</text>
</svg> 