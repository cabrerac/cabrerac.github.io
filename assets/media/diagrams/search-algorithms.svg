<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">
        Early Search Algorithms Comparison
    </text>
    
    <!-- BFS Section -->
    <text x="150" y="60" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">
        Breadth-First Search (BFS)
    </text>
    
    <!-- BFS Tree -->
    <circle cx="150" cy="100" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="100" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="200" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="75" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="125" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="175" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="225" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    
    <!-- BFS Connections -->
    <line x1="150" y1="115" x2="100" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="150" y1="115" x2="200" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="75" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="125" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="175" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="225" y2="185" stroke="#224466" stroke-width="2"/>
    
    <!-- DFS Section -->
    <text x="300" y="60" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">
        Depth-First Search (DFS)
    </text>
    
    <!-- DFS Tree -->
    <circle cx="300" cy="100" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="250" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="350" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="225" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="275" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="325" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <circle cx="375" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    
    <!-- DFS Connections -->
    <line x1="300" y1="115" x2="250" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="300" y1="115" x2="350" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="250" y1="165" x2="225" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="250" y1="165" x2="275" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="350" y1="165" x2="325" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="350" y1="165" x2="375" y2="185" stroke="#224466" stroke-width="2"/>
    
    <!-- A* Section -->
    <text x="450" y="60" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">
        A* Search
    </text>
    
    <!-- A* Tree -->
    <circle cx="450" cy="100" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="400" cy="150" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="500" cy="150" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="375" cy="200" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="425" cy="200" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="475" cy="200" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <circle cx="525" cy="200" r="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    
    <!-- A* Connections -->
    <line x1="450" y1="115" x2="400" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="450" y1="115" x2="500" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="375" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="425" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="500" y1="165" x2="475" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="500" y1="165" x2="525" y2="185" stroke="#224466" stroke-width="2"/>
    
    <!-- Heuristic values for A* -->
    <text x="375" y="220" text-anchor="middle" fill="#224466" font-size="10">h=3</text>
    <text x="425" y="220" text-anchor="middle" fill="#224466" font-size="10">h=2</text>
    <text x="475" y="220" text-anchor="middle" fill="#224466" font-size="10">h=1</text>
    <text x="525" y="220" text-anchor="middle" fill="#224466" font-size="10">h=0</text>
    
    <!-- Legend -->
    <rect x="50" y="300" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="75" y="312" fill="#224466" font-size="12">BFS</text>
    
    <rect x="150" y="300" width="15" height="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="175" y="312" fill="#224466" font-size="12">DFS</text>
    
    <rect x="250" y="300" width="15" height="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="275" y="312" fill="#224466" font-size="12">A*</text>
    
    <!-- Search patterns -->
    <text x="300" y="350" text-anchor="middle" fill="#224466" font-size="12">
        BFS: Level by level | DFS: Deepest path first | A*: Best estimated path
    </text>
</svg> 