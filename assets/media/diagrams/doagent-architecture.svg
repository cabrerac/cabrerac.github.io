<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="system-ui, Segoe UI, sans-serif" font-size="11">
  <defs>
    <linearGradient id="userBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8"/>
      <stop offset="100%" style="stop-color:#c5e3ed"/>
    </linearGradient>
    <linearGradient id="sessionBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7e8"/>
      <stop offset="100%" style="stop-color:#d4e8c4"/>
    </linearGradient>
    <linearGradient id="adapterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#e8dcc8"/>
    </linearGradient>
    <linearGradient id="implBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8f0"/>
      <stop offset="100%" style="stop-color:#d0d0e0"/>
    </linearGradient>
    <linearGradient id="analysisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf4e8"/>
      <stop offset="100%" style="stop-color:#f0e0c0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a9aa8"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a08050"/>
    </marker>
  </defs>

  <!-- User / Public API -->
  <rect x="260" y="16" width="200" height="44" rx="6" fill="url(#userBg)" stroke="#5a9aa8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="32" text-anchor="middle" font-weight="600" fill="#2c3e50">Public API (doagent)</text>
  <text x="360" y="48" text-anchor="middle" fill="#444">Session, Config, Adapters</text>

  <!-- Arrow down from Public API -->
  <path d="M 360 60 L 360 78" stroke="#5a9aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Session layer (core) -->
  <rect x="40" y="86" width="640" height="110" rx="8" fill="url(#sessionBg)" stroke="#6b8e5a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="104" text-anchor="middle" font-weight="600" fill="#2c3e50">Session (core.session)</text>

  <rect x="58" y="114" width="170" height="72" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="143" y="130" text-anchor="middle" font-weight="600" fill="#355">WrappedEnv</text>
  <text x="143" y="146" text-anchor="middle" fill="#555">env.step() &#x2192; outcome</text>
  <text x="143" y="160" text-anchor="middle" fill="#555">+ trace records</text>
  <text x="143" y="174" text-anchor="middle" fill="#555">reset, termination</text>

  <rect x="244" y="114" width="210" height="72" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="349" y="130" text-anchor="middle" font-weight="600" fill="#355">SessionAgent(s)</text>
  <text x="349" y="146" text-anchor="middle" fill="#555">decide() &#x2192; choice {status, action}</text>
  <text x="349" y="160" text-anchor="middle" fill="#555">+ reasoning {z} via TraceCollector</text>
  <text x="349" y="174" text-anchor="middle" fill="#555">tools wrapping &#x0026; merge</text>

  <rect x="470" y="114" width="192" height="72" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="566" y="130" text-anchor="middle" font-weight="600" fill="#355">RecordWriter</text>
  <text x="566" y="146" text-anchor="middle" fill="#555">level-gated writes</text>
  <text x="566" y="160" text-anchor="middle" fill="#555">L0: choice | L1: +trace</text>
  <text x="566" y="174" text-anchor="middle" fill="#555">L2: +reasoning +explanation</text>

  <!-- Arrows from Session components down -->
  <path d="M 143 186 L 143 216 L 260 216 L 260 232" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  <path d="M 349 186 L 349 232" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  <path d="M 566 186 L 566 216 L 460 216 L 460 232" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>

  <!-- SharedDataAdapter protocol -->
  <rect x="160" y="232" width="400" height="48" rx="6" fill="url(#adapterBg)" stroke="#a08050" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="252" text-anchor="middle" font-weight="600" fill="#2c3e50">SharedDataAdapter</text>
  <text x="360" y="266" text-anchor="middle" fill="#555">write, read, list, listen, lookup, index</text>

  <!-- Arrow to implementations -->
  <path d="M 360 280 L 360 300" stroke="#a08050" stroke-width="1.5" fill="none"/>

  <!-- Adapter implementations -->
  <rect x="40" y="300" width="180" height="86" rx="6" fill="url(#implBg)" stroke="#6a6a8a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="318" text-anchor="middle" font-weight="600" fill="#2c3e50">Storage (core)</text>
  <rect x="50" y="328" width="68" height="22" rx="3" fill="#fff" stroke="#6a6a8a"/>
  <text x="84" y="343" text-anchor="middle" fill="#444">InMemory</text>
  <rect x="124" y="328" width="42" height="22" rx="3" fill="#fff" stroke="#6a6a8a"/>
  <text x="145" y="343" text-anchor="middle" fill="#444">File</text>
  <rect x="172" y="328" width="42" height="22" rx="3" fill="#fff" stroke="#6a6a8a"/>
  <text x="193" y="343" text-anchor="middle" fill="#444">Mongo</text>
  <text x="130" y="374" text-anchor="middle" fill="#555" font-size="10">collection-per-kind (.jsonl)</text>

  <!-- Records -->
  <rect x="240" y="300" width="240" height="86" rx="6" fill="#f8f0f0" stroke="#8a6a6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="318" text-anchor="middle" font-weight="600" fill="#2c3e50">Records</text>
  <text x="360" y="336" text-anchor="middle" fill="#444">agent_update {choice, reasoning}</text>
  <text x="360" y="352" text-anchor="middle" fill="#444">outcome, trace</text>
  <text x="360" y="370" text-anchor="middle" fill="#555" font-size="10">+ provenance, accountability metadata</text>

  <!-- Topology + Participation -->
  <rect x="500" y="300" width="180" height="86" rx="6" fill="#f0f0f8" stroke="#6a6a8a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="318" text-anchor="middle" font-weight="600" fill="#2c3e50">Decentralisation</text>
  <text x="590" y="336" text-anchor="middle" fill="#444">Centralised, Federated, P2P</text>
  <text x="590" y="352" text-anchor="middle" fill="#444">TopologyConfig</text>
  <text x="590" y="370" text-anchor="middle" fill="#555" font-size="10">ParticipationRegistry (Openness)</text>

  <!-- Arrow from records down to Analysis -->
  <path d="M 360 386 L 360 408" stroke="#a08050" stroke-width="1.5" fill="none" marker-end="url(#arrowUp)"/>
  <text x="380" y="402" fill="#888" font-size="9">reads</text>

  <!-- Analysis layer -->
  <rect x="80" y="416" width="560" height="82" rx="8" fill="url(#analysisBg)" stroke="#b08840" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="436" text-anchor="middle" font-weight="600" fill="#2c3e50">Analysis (doagent.analysis)</text>

  <rect x="98" y="446" width="120" height="24" rx="3" fill="#fff" stroke="#b08840"/>
  <text x="158" y="462" text-anchor="middle" fill="#444">Provenance</text>
  <rect x="228" y="446" width="120" height="24" rx="3" fill="#fff" stroke="#b08840"/>
  <text x="288" y="462" text-anchor="middle" fill="#444">Traceability</text>
  <rect x="358" y="446" width="130" height="24" rx="3" fill="#fff" stroke="#b08840"/>
  <text x="423" y="462" text-anchor="middle" fill="#444">Accountability</text>
  <rect x="498" y="446" width="130" height="24" rx="3" fill="#fff" stroke="#b08840"/>
  <text x="563" y="462" text-anchor="middle" fill="#444">Interpretability</text>

  <text x="360" y="488" text-anchor="middle" fill="#555" font-size="10">All analysis from shared records only. No access to policy or env internals.</text>

  <!-- Validation (optional) -->
  <rect x="80" y="510" width="560" height="40" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="360" y="528" text-anchor="middle" font-weight="600" fill="#555">Validation (optional): push / gridworld scenarios, RunReporter</text>
  <text x="360" y="542" text-anchor="middle" fill="#777" font-size="10">examples.validation</text>

  <!-- Data flow label -->
  <text x="20" y="260" fill="#666" font-size="9" transform="rotate(-90 20 260)">writes / reads</text>
</svg>
