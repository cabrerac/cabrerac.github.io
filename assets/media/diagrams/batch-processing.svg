<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Batch processing on a schedule</text>

  <!-- Data accumulation -->
  <text x="130" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5597">Bounded input</text>
  <rect x="40" y="88" width="180" height="120" rx="8" fill="#f6f8fa" stroke="#9aa7b4"/>
  <rect x="55" y="108" width="150" height="22" rx="4" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="130" y="123" text-anchor="middle" font-size="11" fill="#1f2d3d">month=01</text>
  <rect x="55" y="136" width="150" height="22" rx="4" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="130" y="151" text-anchor="middle" font-size="11" fill="#1f2d3d">month=02</text>
  <rect x="55" y="164" width="150" height="22" rx="4" fill="#dbe5f1" stroke="#2f5597"/>
  <text x="130" y="179" text-anchor="middle" font-size="11" fill="#1f2d3d">month=03</text>
  <text x="130" y="228" text-anchor="middle" font-size="12" fill="#5a6b7b">Snapshot is complete</text>

  <!-- Schedule -->
  <text x="330" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#c55a11">Schedule</text>
  <circle cx="330" cy="148" r="52" fill="#fbe5d6" stroke="#c55a11" stroke-width="2"/>
  <circle cx="330" cy="148" r="4" fill="#c55a11"/>
  <line x1="330" y1="148" x2="330" y2="110" stroke="#c55a11" stroke-width="3"/>
  <line x1="330" y1="148" x2="360" y2="168" stroke="#c55a11" stroke-width="2"/>
  <text x="330" y="228" text-anchor="middle" font-size="12" fill="#5a6b7b">Nightly / weekly trigger</text>

  <!-- ETL -->
  <text x="530" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5597">ETL run</text>
  <rect x="430" y="96" width="200" height="104" rx="8" fill="#dbe5f1" stroke="#2f5597" stroke-width="2"/>
  <text x="530" y="126" text-anchor="middle" font-size="13" fill="#1f2d3d">Extract</text>
  <text x="530" y="148" text-anchor="middle" font-size="13" fill="#1f2d3d">Transform</text>
  <text x="530" y="170" text-anchor="middle" font-size="13" fill="#1f2d3d">Load</text>
  <text x="530" y="228" text-anchor="middle" font-size="12" fill="#5a6b7b">One job, high throughput</text>

  <!-- Output -->
  <text x="760" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#548235">Curated layer</text>
  <rect x="680" y="96" width="160" height="104" rx="8" fill="#e2efda" stroke="#548235" stroke-width="2"/>
  <text x="760" y="132" text-anchor="middle" font-size="13" fill="#1f2d3d">Aggregates</text>
  <text x="760" y="156" text-anchor="middle" font-size="13" fill="#1f2d3d">Schema contract</text>
  <text x="760" y="180" text-anchor="middle" font-size="13" fill="#1f2d3d">Audit log</text>
  <text x="760" y="228" text-anchor="middle" font-size="12" fill="#5a6b7b">Stable snapshot for analytics</text>

  <g stroke="#5a6b7b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="225" y1="148" x2="268" y2="148"/>
    <line x1="392" y1="148" x2="425" y2="148"/>
    <line x1="635" y1="148" x2="675" y2="148"/>
  </g>

  <!-- GEIH example band -->
  <rect x="40" y="280" width="840" height="130" rx="10" fill="#f3f7ec" stroke="#548235"/>
  <text x="60" y="308" font-size="14" font-weight="bold" fill="#1f2d3d">Course example: GEIH lakehouse</text>
  <text x="60" y="334" font-size="12" fill="#5a6b7b">Partitions from week 2 feed a governed batch ETL that writes curated aggregates for Lecture 6.</text>
  <text x="60" y="358" font-size="12" fill="#5a6b7b">Latency of hours or days is fine. Strong consistency on the snapshot.</text>
  <text x="60" y="386" font-size="12" fill="#5a6b7b">Batch dominates when volume is high and the data boundary is known.</text>

  <text x="460" y="440" text-anchor="middle" font-size="14" fill="#5a6b7b">Collect, then process on a clock</text>
</svg>
