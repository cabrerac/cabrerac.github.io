<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and border -->
  <rect x="0" y="0" width="400" height="400" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  
  <!-- Coordinate axes -->
  <line x1="50" y1="350" x2="350" y2="350" stroke="#333" stroke-width="2"/> <!-- x-axis -->
  <line x1="50" y1="50" x2="50" y2="350" stroke="#333" stroke-width="2"/> <!-- y-axis -->
  
  <!-- Axis labels -->
  <text x="360" y="350" font-family="Arial" font-size="16" fill="#333">x</text>
  <text x="40" y="40" font-family="Arial" font-size="16" fill="#333">y</text>
  
  <!-- Class A data points (blue circles) -->
  <circle cx="80" cy="280" r="5" fill="#3366cc"/>
  <circle cx="100" cy="310" r="5" fill="#3366cc"/>
  <circle cx="120" cy="290" r="5" fill="#3366cc"/>
  <circle cx="140" cy="320" r="5" fill="#3366cc"/>
  <circle cx="90" cy="330" r="5" fill="#3366cc"/>
  <circle cx="110" cy="270" r="5" fill="#3366cc"/>
  <circle cx="160" cy="300" r="5" fill="#3366cc"/>
  <circle cx="180" cy="310" r="5" fill="#3366cc"/>
  <circle cx="130" cy="280" r="5" fill="#3366cc"/>
  <circle cx="150" cy="290" r="5" fill="#3366cc"/>
  <circle cx="170" cy="260" r="5" fill="#3366cc"/>
  <circle cx="190" cy="320" r="5" fill="#3366cc"/>
  <circle cx="200" cy="280" r="5" fill="#3366cc"/>
  <circle cx="220" cy="300" r="5" fill="#3366cc"/>
  
  <!-- Class B data points (red triangles) -->
  <polygon points="250,150 255,160 245,160" fill="#cc3366"/>
  <polygon points="270,170 275,180 265,180" fill="#cc3366"/>
  <polygon points="290,140 295,150 285,150" fill="#cc3366"/>
  <polygon points="310,160 315,170 305,170" fill="#cc3366"/>
  <polygon points="330,130 335,140 325,140" fill="#cc3366"/>
  <polygon points="260,120 265,130 255,130" fill="#cc3366"/>
  <polygon points="280,110 285,120 275,120" fill="#cc3366"/>
  <polygon points="300,180 305,190 295,190" fill="#cc3366"/>
  <polygon points="320,150 325,160 315,160" fill="#cc3366"/>
  <polygon points="240,140 245,150 235,150" fill="#cc3366"/>
  <polygon points="230,170 235,180 225,180" fill="#cc3366"/>
  <polygon points="250,190 255,200 245,200" fill="#cc3366"/>
  <polygon points="270,130 275,140 265,140" fill="#cc3366"/>
  <polygon points="290,120 295,130 285,130" fill="#cc3366"/>
  
  <!-- Outliers (mixed colors and shapes) -->
  <circle cx="240" cy="260" r="5" fill="#3366cc"/>
  <polygon points="180,200 185,210 175,210" fill="#cc3366"/>
  <circle cx="210" cy="220" r="5" fill="#3366cc"/>
  <polygon points="160,170 165,180 155,180" fill="#cc3366"/>
  
  <!-- Decision boundary (curved dashed line) -->
  <path d="M50,200 Q150,300 250,200 T400,180" stroke="#666" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Legend -->
  <circle cx="60" cy="70" r="5" fill="#3366cc"/>
  <text x="70" y="75" font-family="Arial" font-size="14" fill="#333">Class A</text>
  <polygon points="60,90 65,100 55,100" fill="#cc3366"/>
  <text x="70" y="95" font-family="Arial" font-size="14" fill="#333">Class B</text>
  <line x1="60" y1="115" x2="80" y2="115" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="85" y="120" font-family="Arial" font-size="14" fill="#333">Decision Boundary</text>
</svg> 