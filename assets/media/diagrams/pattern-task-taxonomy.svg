<?xml version="1.0" encoding="UTF-8"?>
<!-- Taxonomy of methods for the pattern task. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <style type="text/css"><![CDATA[
      .root-box { fill:#224466; stroke:#224466; stroke-width:2; }
      .root-txt { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:22px; font-weight:600; fill:#ffffff; text-anchor:middle; dominant-baseline:middle; }
      .fam-box { fill:#ffffff; stroke:#224466; stroke-width:2; }
      .fam-txt { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:16px; font-weight:600; fill:#224466; text-anchor:middle; dominant-baseline:middle; }
      .taught-box { fill:#0e73b8; stroke:#0e73b8; stroke-width:2; }
      .taught-txt { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:15px; font-weight:600; fill:#ffffff; text-anchor:middle; dominant-baseline:middle; }
      .leaf-box { fill:#f6f8fa; stroke:#224466; stroke-width:1.5; }
      .leaf-txt { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:15px; fill:#224466; text-anchor:middle; dominant-baseline:middle; }
      .edge { stroke:#224466; stroke-width:2; fill:none; }
      .note { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:14px; fill:#224466; text-anchor:middle; }
    ]]></style>
  </defs>

  <rect x="490" y="12" width="300" height="46" rx="8" class="root-box"/>
  <text x="640" y="35" class="root-txt">Pattern task</text>

  <path class="edge" d="M 640 58 V 86 H 164 V 112"/>
  <path class="edge" d="M 640 86 H 476 V 112"/>
  <path class="edge" d="M 640 86 H 788 V 112"/>
  <path class="edge" d="M 640 86 H 1100 V 112"/>

  <rect x="24" y="112" width="280" height="48" rx="8" class="fam-box"/>
