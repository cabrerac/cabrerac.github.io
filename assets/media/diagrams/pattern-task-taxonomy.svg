  <text x="164" y="198" class="taught-txt">Support count</text>
  <path class="edge" d="M 164 218 V 236"/>
  <rect x="24" y="236" width="280" height="40" rx="8" class="leaf-box"/>
  <text x="164" y="256" class="leaf-txt">FP-growth</text>
  <path class="edge" d="M 164 276 V 294"/>
  <rect x="24" y="294" width="280" height="40" rx="8" class="leaf-box"/>
  <text x="164" y="314" class="leaf-txt">Eclat</text>

  <rect x="336" y="112" width="280" height="48" rx="8" class="fam-box"/>
  <text x="476" y="136" class="fam-txt">Interestingness</text>
  <path class="edge" d="M 476 160 V 178"/>
  <rect x="336" y="178" width="280" height="40" rx="8" class="taught-box"/>
