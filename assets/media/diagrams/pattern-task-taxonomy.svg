  <rect x="648" y="112" width="280" height="48" rx="8" class="fam-box"/>
  <text x="788" y="136" class="fam-txt">Sequential patterns</text>
  <path class="edge" d="M 788 160 V 178"/>
  <rect x="648" y="178" width="280" height="40" rx="8" class="leaf-box"/>
