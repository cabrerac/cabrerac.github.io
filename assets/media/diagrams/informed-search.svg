<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="520" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="390" y="30" text-anchor="middle" fill="#224466" font-size="22" font-weight="bold">
        Informed Search Algorithms
    </text>
    
    <!-- A* Tree Section Title -->
    <text x="215" y="70" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        A* Search Algorithm
    </text> 
    
    <!-- Row 1 -->
    <circle cx="200" cy="130" r="25" fill="#4a90e2" stroke="#224466" stroke-width="3"/>
    <text x="200" y="125" text-anchor="middle" fill="white" font-size="18" font-weight="bold">A</text>
    <text x="200" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=450</text>
    
    <!-- Row 2 -->
    <circle cx="100" cy="200" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="100" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">E</text>
    <text x="100" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=401</text>
    
    <circle cx="300" cy="200" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="300" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">B</text>
    <text x="300" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=450</text>
    
    <!-- Row 3 -->
    <circle cx="50" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="50" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">H</text>
    <text x="50" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=431</text>    
    
    <circle cx="150" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="150" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">I</text>
    <text x="150" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=361</text>
    
    <circle cx="250" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="250" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">F</text>
    <text x="250" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=422</text>
    
    <!-- A* Connections -->
    <line x1="200" y1="155" x2="112" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="140" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">71</text>
    
    <line x1="200" y1="155" x2="287" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="260" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">75</text>
    
    <line x1="100" y1="225" x2="62" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="70" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">70</text>
    
    <line x1="100" y1="225" x2="137" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="110" y="250" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">90</text>
    
    <line x1="100" y1="225" x2="230" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="210" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">101</text>
    
    <!-- A* Frontier -->
    <circle cx="50" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="150" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="250" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    
    <!-- A* Next to Expand -->
    <circle cx="150" cy="270" r="35" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="110" y="275" text-anchor="end" fill="#ff0000" font-size="14" font-weight="bold">Next</text>
    
    <!-- A* Decision Path -->
    <text x="200" y="345" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">A* Path: A → E → I → ... → M</text>
    
    <!-- Greedy Tree Section Title -->
    <text x="615" y="70" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        Greedy Best-First Search
    </text>
    
    <!-- Row 1 -->
    <circle cx="575" cy="130" r="25" fill="#50c878" stroke="#224466" stroke-width="3"/>
    <text x="575" y="125" text-anchor="middle" fill="white" font-size="18" font-weight="bold">A</text>
    <text x="575" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=450</text>
    
    <!-- Row 2 -->
    <circle cx="475" cy="200" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="475" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">B</text>
    <text x="475" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=375</text>
    
    <circle cx="675" cy="200" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="675" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">E</text>
    <text x="675" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=330</text>
    
    <circle cx="525" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="525" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">F</text>
    <text x="525" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=250</text>
    
    <circle cx="625" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="625" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">H</text>
    <text x="625" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=290</text>
    
    <circle cx="725" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="725" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">I</text>
    <text x="725" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=200</text>
    
    <!-- Greedy Connections -->
    <line x1="575" y1="155" x2="487" y2="183" stroke="#224466" stroke-width="2"/>
    
    <line x1="575" y1="155" x2="662" y2="183" stroke="#224466" stroke-width="2"/>
        
    <line x1="675" y1="225" x2="540" y2="252" stroke="#224466" stroke-width="2"/>
        
    <line x1="675" y1="225" x2="637" y2="252" stroke="#224466" stroke-width="2"/>
        
    <line x1="675" y1="225" x2="712" y2="252" stroke="#224466" stroke-width="2"/>
        
    <!-- Greedy Frontier -->
    <circle cx="525" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="625" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="725" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    
    <!-- Greedy Next to Expand -->
    <circle cx="725" cy="270" r="35" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="685" y="275" text-anchor="end" fill="#ff0000" font-size="14" font-weight="bold">Next</text>
        
    <!-- Greedy Decision Path -->
    <text x="575" y="345" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">Greedy Path: A → E → I → ... → M</text>
    
    <!-- A* side -->
    <text x="215" y="380" text-anchor="middle" fill="#224466" font-size="14">Uses f(n) = g(n) + h(n)</text>
    <text x="215" y="400" text-anchor="middle" fill="#224466" font-size="14">Balances cost so far and heuristic</text>
    
    <!-- Greedy side -->
    <text x="590" y="380" text-anchor="middle" fill="#224466" font-size="14">Uses f(n) = h(n)</text>
    <text x="590" y="400" text-anchor="middle" fill="#224466" font-size="14">Only considers estimated distance to goal</text>
    
    <!-- Legend -->
    <rect x="160" y="420" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="185" y="435" fill="#224466" font-size="14">A* - Optimal, complete, admissible</text>
    
    <rect x="160" y="450" width="15" height="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="185" y="465" fill="#224466" font-size="14">Greedy - Fast, not optimal or complete</text>

</svg>
