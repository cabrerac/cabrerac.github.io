<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" fill="#224466" font-size="22" font-weight="bold">
        Informed Search Algorithms
    </text>
    
    <!-- A* Tree Section Title -->
    <text x="225" y="70" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        A* Search Algorithm
    </text>
    
    
    
    <!-- Row 1 -->
    <circle cx="210" cy="130" r="25" fill="#4a90e2" stroke="#224466" stroke-width="3"/>
    <text x="210" y="125" text-anchor="middle" fill="white" font-size="18" font-weight="bold">A</text>
    <text x="210" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=450</text>
    
    <!-- Row 2 -->
    <circle cx="110" cy="200" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="110" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">E</text>
    <text x="110" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=401</text>
    
    <circle cx="310" cy="200" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="310" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">B</text>
    <text x="310" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=450</text>
    
    <!-- Row 3 -->
    <circle cx="60" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="60" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">H</text>
    <text x="60" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=431</text>    
    
    <circle cx="160" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="160" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">I</text>
    <text x="160" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=361</text>
    
    <circle cx="260" cy="270" r="25" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="260" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">F</text>
    <text x="260" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">f=422</text>
    
    <!-- A* Connections -->
    <line x1="210" y1="155" x2="122" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="150" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">71</text>
    
    <line x1="210" y1="155" x2="297" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="270" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">75</text>
    
    <line x1="110" y1="225" x2="72" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="80" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">70</text>
    
    <line x1="110" y1="225" x2="147" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="120" y="250" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">90</text>
    
    <line x1="110" y1="225" x2="240" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="220" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">101</text>
    
    <!-- A* Frontier -->
    <circle cx="60" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="160" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="260" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    
    <!-- A* Next to Expand -->
    <circle cx="160" cy="270" r="35" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="120" y="275" text-anchor="end" fill="#ff0000" font-size="14" font-weight="bold">Next</text>
    
    <!-- A* Decision Path -->
    <text x="210" y="345" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">A* Path: A → E → I → ... → M</text>
    
    <!-- Greedy Tree Section Title -->
    <text x="625" y="70" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        Greedy Best-First Search
    </text>
    
    <!-- Row 1 -->
    <circle cx="585" cy="130" r="25" fill="#50c878" stroke="#224466" stroke-width="3"/>
    <text x="585" y="125" text-anchor="middle" fill="white" font-size="18" font-weight="bold">A</text>
    <text x="585" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=450</text>
    
    <!-- Row 2 -->
    <circle cx="485" cy="200" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="485" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">B</text>
    <text x="485" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=375</text>
    
    <circle cx="685" cy="200" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="685" y="195" text-anchor="middle" fill="white" font-size="18" font-weight="bold">E</text>
    <text x="685" y="215" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=330</text>
    
    <circle cx="535" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="535" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">F</text>
    <text x="535" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=250</text>
    
    <circle cx="635" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="635" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">H</text>
    <text x="635" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=290</text>
    
    <circle cx="735" cy="270" r="25" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="735" y="265" text-anchor="middle" fill="white" font-size="18" font-weight="bold">I</text>
    <text x="735" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">h=200</text>
    
    <!-- Greedy Connections -->
    <line x1="585" y1="155" x2="497" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="540" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">75</text>
    
    <line x1="585" y1="155" x2="672" y2="183" stroke="#224466" stroke-width="2"/>
    <text x="630" y="160" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">71</text>
    
    <line x1="685" y1="225" x2="550" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="575" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">99</text>
    
    <line x1="685" y1="225" x2="647" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="675" y="250" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">70</text>
    
    <line x1="685" y1="225" x2="722" y2="252" stroke="#224466" stroke-width="2"/>
    <text x="720" y="240" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">90</text>
    
    <!-- Greedy Frontier -->
    <circle cx="535" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="635" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="735" cy="270" r="30" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    
    <!-- Greedy Next to Expand -->
    <circle cx="635" cy="270" r="35" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="595" y="275" text-anchor="end" fill="#ff0000" font-size="14" font-weight="bold">Next</text>
        
    <!-- Greedy Decision Path -->
    <text x="585" y="345" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">Greedy Path: A → B → H → ... → M</text>
    
    <!-- Comparison Section -->
    <rect x="100" y="380" width="600" height="150" fill="#f0f5ff" stroke="#224466" stroke-width="1" rx="10"/>
    <!-- Comparison content -->
    <line x1="400" y1="380" x2="400" y2="530" stroke="#c0c0c0" stroke-width="1"/>
    
    <!-- A* side -->
    <text x="225" y="415" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">A* Search</text>
    <text x="225" y="435" text-anchor="middle" fill="#224466" font-size="14">• Uses f(n) = g(n) + h(n)</text>
    <text x="225" y="455" text-anchor="middle" fill="#224466" font-size="14">• Balances cost so far and heuristic</text>
    <text x="225" y="475" text-anchor="middle" fill="#224466" font-size="14">• Optimal path: 331 km</text>
    <text x="225" y="495" text-anchor="middle" fill="#224466" font-size="14">• Guaranteed to find shortest path</text>
    
    <!-- Greedy side -->
    <text x="550" y="415" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">Greedy Best-First Search</text>
    <text x="550" y="435" text-anchor="middle" fill="#224466" font-size="14">• Uses f(n) = h(n)</text>
    <text x="550" y="455" text-anchor="middle" fill="#224466" font-size="14">• Only considers estimated distance to goal</text>
    <text x="550" y="475" text-anchor="middle" fill="#224466" font-size="14">• Non-optimal path: 364 km</text>
    <text x="550" y="495" text-anchor="middle" fill="#224466" font-size="14">• Fast but not guaranteed optimal</text>
    
    <!-- Legend -->
    <rect x="170" y="560" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="195" y="575" fill="#224466" font-size="14">A* - Optimal, complete, admissible</text>
    
    <rect x="170" y="590" width="15" height="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="195" y="605" fill="#224466" font-size="14">Greedy - Fast, not optimal or complete</text>
    
    <circle cx="450" cy="565" r="10" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="475" y="575" fill="#224466" font-size="14">Frontier nodes</text>
    
    <circle cx="450" cy="595" r="10" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="475" y="605" fill="#224466" font-size="14">Next node to explore</text>
</svg>
