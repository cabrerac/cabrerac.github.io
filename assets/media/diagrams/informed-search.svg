<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">
        Informed Search Algorithms
    </text>
    
    <!-- Graph visual for both algorithms -->
    <rect x="60" y="70" width="480" height="180" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="5" ry="5"/>
    
    <!-- Grid for representing map/space -->
    <line x1="120" y1="80" x2="120" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="180" y1="80" x2="180" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="240" y1="80" x2="240" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="300" y1="80" x2="300" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="360" y1="80" x2="360" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="420" y1="80" x2="420" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="480" y1="80" x2="480" y2="240" stroke="#ddd" stroke-width="1"/>
    
    <line x1="60" y1="100" x2="540" y2="100" stroke="#ddd" stroke-width="1"/>
    <line x1="60" y1="140" x2="540" y2="140" stroke="#ddd" stroke-width="1"/>
    <line x1="60" y1="180" x2="540" y2="180" stroke="#ddd" stroke-width="1"/>
    <line x1="60" y1="220" x2="540" y2="220" stroke="#ddd" stroke-width="1"/>
    
    <!-- Obstacles -->
    <rect x="180" y="100" width="60" height="80" fill="#555" rx="3" ry="3"/>
    <rect x="300" y="140" width="60" height="80" fill="#555" rx="3" ry="3"/>
    <rect x="420" y="100" width="60" height="40" fill="#555" rx="3" ry="3"/>
    
    <!-- Start and goal -->
    <circle cx="90" cy="120" r="12" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="90" y="124" text-anchor="middle" fill="white" font-size="12" font-weight="bold">S</text>
    
    <circle cx="510" cy="200" r="12" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="510" y="204" text-anchor="middle" fill="white" font-size="12" font-weight="bold">G</text>
    
    <!-- A* Path -->
    <path d="M90,120 L120,120 L150,120 L150,180 L210,180 L240,180 L270,180 L270,220 L330,220 L390,220 L450,220 L480,200 L510,200" 
          stroke="#4a90e2" stroke-width="3" fill="none" stroke-dasharray="none"/>
    <text x="170" y="65" fill="#4a90e2" font-size="14" font-weight="bold">A* Search Path</text>
    
    <!-- Greedy Search Path -->
    <path d="M90,120 L120,120 L150,120 L150,100 L240,100 L240,180 L270,180 L270,220 L330,220 L390,220 L450,220 L480,200 L510,200" 
          stroke="#50c878" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <text x="430" y="65" fill="#50c878" font-size="14" font-weight="bold">Greedy Best-First Path</text>
    
    <!-- Heuristic visualization -->
    <text x="300" y="270" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">Heuristic Function Visualization</text>
    
    <!-- Heuristic formula -->
    <text x="150" y="295" text-anchor="middle" fill="#224466" font-size="12">Manhattan Distance: h(n) = |x₁-x₂| + |y₁-y₂|</text>
    <text x="450" y="295" text-anchor="middle" fill="#224466" font-size="12">Euclidean Distance: h(n) = √[(x₁-x₂)² + (y₁-y₂)²]</text>
    
    <!-- A* formula -->
    <text x="150" y="330" text-anchor="middle" fill="#224466" font-size="12" font-weight="bold">A* evaluation function:</text>
    <text x="150" y="350" text-anchor="middle" fill="#224466" font-size="12">f(n) = g(n) + h(n)</text>
    <text x="150" y="365" text-anchor="middle" fill="#224466" font-size="10">g(n): path cost from start to node n</text>
    <text x="150" y="380" text-anchor="middle" fill="#224466" font-size="10">h(n): estimated cost from n to goal</text>
    
    <!-- Greedy formula -->
    <text x="450" y="330" text-anchor="middle" fill="#224466" font-size="12" font-weight="bold">Greedy Best-First function:</text>
    <text x="450" y="350" text-anchor="middle" fill="#224466" font-size="12">f(n) = h(n)</text>
    <text x="450" y="365" text-anchor="middle" fill="#224466" font-size="10">Only considers the heuristic</text>
    <text x="450" y="380" text-anchor="middle" fill="#224466" font-size="10">Ignores path cost so far</text>
    
    <!-- Legend -->
    <rect x="270" y="320" width="60" height="25" fill="none" stroke="#224466" stroke-width="1"/>
    <line x1="280" y1="330" x2="300" y2="330" stroke="#4a90e2" stroke-width="3"/>
    <text x="310" y="334" fill="#224466" font-size="10">A*</text>
    
    <rect x="270" y="350" width="60" height="25" fill="none" stroke="#224466" stroke-width="1"/>
    <line x1="280" y1="360" x2="300" y2="360" stroke="#50c878" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="310" y="364" fill="#224466" font-size="10">Greedy</text>
</svg> 