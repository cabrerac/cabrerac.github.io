<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        Informed Search Algorithms
    </text>
    
    <!-- A* Section -->
    <text x="150" y="60" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">
        A* Search
    </text>
    
    <!-- A* Tree -->
    <circle cx="150" cy="100" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="150" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
    
    <circle cx="100" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="100" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
    
    <circle cx="200" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="200" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">11</text>
    
    <circle cx="75" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="75" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">12</text>
    
    <circle cx="125" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="125" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">13</text>
    
    <circle cx="175" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="175" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">21</text>
    
    <circle cx="225" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="225" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">22</text>
    
    <circle cx="175" cy="250" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="175" y="255" text-anchor="middle" fill="white" font-size="16" font-weight="bold">31</text>
    
    <circle cx="225" cy="250" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="225" y="255" text-anchor="middle" fill="white" font-size="16" font-weight="bold">32</text>
    
    <!-- A* Path Costs -->
    <text x="120" y="125" text-anchor="middle" fill="#d24939" font-size="12">f=7</text>
    <text x="180" y="125" text-anchor="middle" fill="#d24939" font-size="12">f=8</text>
    <text x="75" y="175" text-anchor="middle" fill="#d24939" font-size="12">f=10</text>
    <text x="125" y="175" text-anchor="middle" fill="#d24939" font-size="12">f=12</text>
    <text x="175" y="175" text-anchor="middle" fill="#d24939" font-size="12">f=13</text>
    <text x="225" y="175" text-anchor="middle" fill="#d24939" font-size="12">f=15</text>
    <text x="175" y="225" text-anchor="middle" fill="#d24939" font-size="12">f=18</text>
    <text x="225" y="225" text-anchor="middle" fill="#d24939" font-size="12">f=20</text>
    
    <!-- A* Connections -->
    <line x1="150" y1="115" x2="100" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="150" y1="115" x2="200" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="75" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="125" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="175" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="225" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="175" y1="215" x2="175" y2="235" stroke="#224466" stroke-width="2"/>
    <line x1="225" y1="215" x2="225" y2="235" stroke="#224466" stroke-width="2"/>
    
    <!-- Greedy Best-First Section -->
    <text x="450" y="60" text-anchor="middle" fill="#224466" font-size="18" font-weight="bold">
        Greedy Best-First Search
    </text>
    
    <!-- Greedy Best-First Tree -->
    <circle cx="450" cy="100" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="450" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="bold">1</text>
    
    <circle cx="400" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="400" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2</text>
    
    <circle cx="500" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="500" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">11</text>
    
    <circle cx="500" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="500" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">12</text>
    
    <circle cx="500" cy="250" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="500" y="255" text-anchor="middle" fill="white" font-size="16" font-weight="bold">22</text>
    
    <circle cx="450" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="450" y="205" text-anchor="middle" fill="white" font-size="16" font-weight="bold">3</text>
    
    <circle cx="400" cy="250" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" fill="white" font-size="16" font-weight="bold">13</text>
    
    <!-- Greedy Heuristic Values -->
    <text x="420" y="125" text-anchor="middle" fill="#d24939" font-size="12">h=5</text>
    <text x="480" y="125" text-anchor="middle" fill="#d24939" font-size="12">h=4</text>
    <text x="525" y="175" text-anchor="middle" fill="#d24939" font-size="12">h=3</text>
    <text x="525" y="225" text-anchor="middle" fill="#d24939" font-size="12">h=2</text>
    <text x="425" y="175" text-anchor="middle" fill="#d24939" font-size="12">h=4</text>
    <text x="375" y="225" text-anchor="middle" fill="#d24939" font-size="12">h=5</text>
    
    <!-- Greedy Best-First Connections -->
    <line x1="450" y1="115" x2="400" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="450" y1="115" x2="500" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="500" y1="165" x2="500" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="500" y1="215" x2="500" y2="235" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="450" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="400" y2="235" stroke="#224466" stroke-width="2"/>
    
    <!-- Algorithm Descriptions -->
    <text x="150" y="290" text-anchor="middle" fill="#224466" font-size="16" font-style="italic">f(n) = g(n) + h(n)</text>
    <text x="150" y="310" text-anchor="middle" fill="#224466" font-size="14">Balances cost so far and heuristic</text>
    
    <text x="450" y="290" text-anchor="middle" fill="#224466" font-size="16" font-style="italic">f(n) = h(n)</text>
    <text x="450" y="310" text-anchor="middle" fill="#224466" font-size="14">Only considers heuristic distance</text>
    
    <!-- Legend -->
    <rect x="50" y="340" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="280" y="352" fill="#224466" font-size="14">A* - Complete and optimal with admissible heuristics</text>
    
    <rect x="50" y="370" width="15" height="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="245" y="382" fill="#224466" font-size="14">Greedy - Fast but not optimal, follows heuristic</text>
</svg> 