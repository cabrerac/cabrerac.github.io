<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2d3d">Data lake, warehouse, and lakehouse</text>

  <!-- Data lake -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="270" height="400" rx="8" fill="#f6f8fa" stroke="#2f5597"/>
    <rect x="0" y="0" width="270" height="50" rx="8" fill="#dbe5f1" stroke="#2f5597"/>
    <text x="135" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Data lake</text>
    <text x="20" y="86" font-size="14" fill="#5a6b7b">Raw files, any format</text>
    <text x="20" y="118" font-size="14" fill="#5a6b7b">Schema-on-read</text>
    <text x="20" y="150" font-size="14" fill="#5a6b7b">Cheap object storage</text>
    <text x="20" y="182" font-size="14" fill="#5a6b7b">Flexible, low structure</text>
    <text x="20" y="230" font-size="13" fill="#c55a11">No transactions</text>
    <text x="20" y="258" font-size="13" fill="#c55a11">Easy to turn into a swamp</text>
    <text x="20" y="350" font-size="13" font-style="italic" fill="#5a6b7b">e.g. CSV/JSON on S3</text>
  </g>

  <!-- Warehouse -->
  <g transform="translate(345,80)">
    <rect x="0" y="0" width="270" height="400" rx="8" fill="#f6f8fa" stroke="#548235"/>
    <rect x="0" y="0" width="270" height="50" rx="8" fill="#e2efda" stroke="#548235"/>
    <text x="135" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Warehouse</text>
    <text x="20" y="86" font-size="14" fill="#5a6b7b">Modelled tables</text>
    <text x="20" y="118" font-size="14" fill="#5a6b7b">Schema-on-write</text>
    <text x="20" y="150" font-size="14" fill="#5a6b7b">ACID transactions</text>
    <text x="20" y="182" font-size="14" fill="#5a6b7b">Fast SQL analytics</text>
    <text x="20" y="230" font-size="13" fill="#c55a11">Rigid, costly to change</text>
    <text x="20" y="258" font-size="13" fill="#c55a11">Hard with raw variety</text>
    <text x="20" y="350" font-size="13" font-style="italic" fill="#5a6b7b">e.g. Teradata, BigQuery</text>
  </g>

  <!-- Lakehouse -->
  <g transform="translate(650,80)">
    <rect x="0" y="0" width="270" height="400" rx="8" fill="#f6f8fa" stroke="#c55a11"/>
    <rect x="0" y="0" width="270" height="50" rx="8" fill="#fbe5d6" stroke="#c55a11"/>
    <text x="135" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Lakehouse</text>
    <text x="20" y="86" font-size="14" fill="#5a6b7b">Files in the lake, plus</text>
    <text x="20" y="118" font-size="14" fill="#5a6b7b">a table format on top</text>
    <text x="20" y="150" font-size="14" fill="#5a6b7b">ACID + versioning</text>
    <text x="20" y="182" font-size="14" fill="#5a6b7b">SQL engines on Parquet</text>
    <text x="20" y="236" font-size="13" fill="#548235">Lake flexibility</text>
    <text x="20" y="264" font-size="13" fill="#548235">Warehouse guarantees</text>
    <text x="20" y="350" font-size="13" font-style="italic" fill="#5a6b7b">Parquet + Delta / Iceberg</text>
  </g>
</svg>
