<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="400" fill="#f5f5f5"/>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Training Process</text>
    
    <!-- Training Data Box (top) -->
    <rect x="325" y="80" width="150" height="60" rx="10" fill="#4CAF50" stroke="#333" stroke-width="2"/>
    <text x="400" y="115" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">Training Data</text>
    
    <!-- Model Box (right) -->
    <rect x="570" y="170" width="150" height="60" rx="10" fill="#2196F3" stroke="#333" stroke-width="2"/>
    <text x="645" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">Model</text>
    
    <!-- Loss Calculation Box (bottom) -->
    <rect x="325" y="260" width="150" height="60" rx="10" fill="#FF9800" stroke="#333" stroke-width="2"/>
    <text x="400" y="295" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">Loss Calculation</text>
    
    <!-- Parameter Update Box (left) -->
    <rect x="80" y="170" width="150" height="60" rx="10" fill="#9C27B0" stroke="#333" stroke-width="2"/>
    <text x="155" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="white" style="font-weight: bold">Parameter Update</text>
    
    <!-- Arrows (clockwise cycle) -->
    <path d="M475 110 Q645 110 645 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M645 230 Q645 290 475 290" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M325 290 Q155 290 155 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M155 170 Q155 110 325 110" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg> 