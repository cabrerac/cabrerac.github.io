<?xml version="1.0" encoding="UTF-8"?>
<!-- An attribute on every item (a1) cannot separate groups. Attributes on a few items (a2, a3, a4) can. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520">
  <defs>
    <style type="text/css"><![CDATA[
      .label { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:22px; font-weight:600; fill:#224466; text-anchor:middle; }
      .cell-light { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:20px; font-weight:600; fill:#ffffff; text-anchor:middle; }
      .cell { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:20px; font-weight:600; fill:#224466; text-anchor:middle; }
      .note { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:18px; fill:#224466; text-anchor:middle; }
    ]]></style>
  </defs>
  <text x="380" y="36" class="label">Which attribute separates the groups?</text>
  <text x="255" y="110" class="label">a1</text>
  <text x="365" y="110" class="label">a2</text>
  <text x="475" y="110" class="label">a3</text>
  <text x="585" y="110" class="label">a4</text>
  <text x="160" y="172" class="label">A</text>
  <rect x="200" y="132" width="110" height="62" fill="#9aa5b1" stroke="#ffffff" stroke-width="2"/>
  <text x="255" y="172" class="cell-light">1</text>
  <rect x="310" y="132" width="110" height="62" fill="#0e73b8" stroke="#ffffff" stroke-width="2"/>
  <text x="365" y="172" class="cell-light">1</text>
  <rect x="420" y="132" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="475" y="172" class="cell">0</text>
  <rect x="530" y="132" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="585" y="172" class="cell">0</text>
  <text x="160" y="234" class="label">B</text>
  <rect x="200" y="194" width="110" height="62" fill="#9aa5b1" stroke="#ffffff" stroke-width="2"/>
  <text x="255" y="234" class="cell-light">1</text>
  <rect x="310" y="194" width="110" height="62" fill="#0e73b8" stroke="#ffffff" stroke-width="2"/>
  <text x="365" y="234" class="cell-light">1</text>
  <rect x="420" y="194" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="475" y="234" class="cell">0</text>
  <rect x="530" y="194" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="585" y="234" class="cell">0</text>
  <text x="160" y="296" class="label">C</text>
  <rect x="200" y="256" width="110" height="62" fill="#9aa5b1" stroke="#ffffff" stroke-width="2"/>
  <text x="255" y="296" class="cell-light">1</text>
  <rect x="310" y="256" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="365" y="296" class="cell">0</text>
  <rect x="420" y="256" width="110" height="62" fill="#0e73b8" stroke="#ffffff" stroke-width="2"/>
  <text x="475" y="296" class="cell-light">1</text>
  <rect x="530" y="256" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="585" y="296" class="cell">0</text>
  <text x="160" y="358" class="label">D</text>
  <rect x="200" y="318" width="110" height="62" fill="#9aa5b1" stroke="#ffffff" stroke-width="2"/>
  <text x="255" y="358" class="cell-light">1</text>
  <rect x="310" y="318" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="365" y="358" class="cell">0</text>
  <rect x="420" y="318" width="110" height="62" fill="#0e73b8" stroke="#ffffff" stroke-width="2"/>
  <text x="475" y="358" class="cell-light">1</text>
  <rect x="530" y="318" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="585" y="358" class="cell">0</text>
  <text x="160" y="420" class="label">E</text>
  <rect x="200" y="380" width="110" height="62" fill="#9aa5b1" stroke="#ffffff" stroke-width="2"/>
  <text x="255" y="420" class="cell-light">1</text>
  <rect x="310" y="380" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="365" y="420" class="cell">0</text>
  <rect x="420" y="380" width="110" height="62" fill="#eef3f8" stroke="#ffffff" stroke-width="2"/>
  <text x="475" y="420" class="cell">0</text>
  <rect x="530" y="380" width="110" height="62" fill="#0e73b8" stroke="#ffffff" stroke-width="2"/>
  <text x="585" y="420" class="cell-light">1</text>
  <text x="255" y="476" class="note">in every item</text>
  <text x="255" y="500" class="note">no split</text>
  <text x="420" y="476" class="note">in a few items</text>
  <text x="420" y="500" class="note">marks a group</text>
</svg>
