<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">DOAgent-Safe overview</title>
  <desc id="desc">From service-oriented opacity to a data-oriented sandbox enabling scaling, market evaluation, clinical transfer, and oversight.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#f8fafc"/>

  <!-- LEFT: Today / AI Services (SOAs) -->
  <rect x="20" y="48" width="200" height="288" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="74" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700" fill="#0f172a">Today: AI Services (SOAs)</text>
  <text x="120" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Data Dichotomy</text>

  <rect x="40" y="114" width="68" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="74" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f1d1d">Agent A</text>
  <text x="74" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#991b1b">API/hidden data</text>

  <rect x="132" y="114" width="68" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="166" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f1d1d">Agent B</text>
  <text x="166" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#991b1b">API/hidden data</text>

  <rect x="40" y="170" width="68" height="42" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="74" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7f1d1d">Agent C</text>
  <text x="74" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#991b1b">API/hidden data</text>

  <rect x="132" y="170" width="68" height="42" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="166" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Overseer</text>
  <text x="166" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b">partial view</text>

  <line x1="108" y1="191" x2="132" y2="191" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>

  <text x="120" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Logs rebuilt from API/data</text>
  <text x="120" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Attribution hard under</text>
  <text x="120" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">multi-principal opacity</text>

  <line x1="228" y1="192" x2="258" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="243" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">DOA</text>

  <!-- OUTER: DOAgent-Safe (all WPs), blue -->
  <rect x="266" y="36" width="674" height="300" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
  <text x="603" y="58" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="700" fill="#0c4a6e">DOAgent-Safe (24 months)</text>

  <!-- WP1: three principles (your wording) -->
  <rect x="282" y="72" width="250" height="248" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="407" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">WP1 (months 1-9)</text>
  <text x="407" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#0369a1">Three DOA principles</text>

  <rect x="296" y="124" width="222" height="56" rx="4" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1"/>
  <text x="407" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">1. Data as first-class citizen</text>
  <text x="407" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Shared records: decisions, outcomes, interactions</text>
  <text x="407" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Provenance, accountability, "I don't know"</text>

  <rect x="296" y="186" width="222" height="48" rx="4" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1"/>
  <text x="407" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">2. Prioritised decentralisation</text>
  <text x="407" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Centralised, P2P, federated deployments</text>

  <rect x="296" y="242" width="222" height="48" rx="4" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1"/>
  <text x="407" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">3. Openness</text>
  <text x="407" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Participation protocols: agents join or leave</text>

  <text x="407" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#0369a1">Configurable visibility: library + known datasets</text>

  <!-- Internal arrows WP1 -> WP2/3/4 -->
  <line x1="540" y1="140" x2="568" y2="112" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="196" x2="568" y2="196" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="260" x2="568" y2="280" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- WP2, WP3, WP4 -->
  <rect x="576" y="72" width="348" height="68" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="750" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">WP2 - Scaling the substrate (months 6-18)</text>
  <text x="750" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">DOA-like patterns: overhead/fidelity at population</text>

  <rect x="576" y="156" width="348" height="68" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="750" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">WP3 - Market evaluation (months 9-18)</text>
  <text x="750" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Multi-principal attribution and detection</text>

  <rect x="576" y="240" width="348" height="68" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="750" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0c4a6e">WP4 - Clinical transfer and oversight (months 12-24)</text>
  <text x="750" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">GenAI4Care, aICU scenarios and workshops</text>

  <!-- Outcomes -->
  <rect x="20" y="356" width="920" height="44" rx="6" fill="#0f172a"/>
  <text x="480" y="383" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8fafc">Measurable outcomes: attribution, unsafe-episode detection, oversight accuracy/time, transfer results</text>
</svg>
