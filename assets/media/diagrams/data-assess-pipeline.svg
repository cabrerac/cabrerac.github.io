<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="280" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1180" height="280" fill="#ffffff"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" text-anchor="middle" fill="#224466">Machine Learning Pipeline</text>
    
    <!-- Category Bands -->
    <!-- Data Access -->
    <rect x="60" y="70" width="140" height="30" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
    <text x="130" y="90" font-family="Arial" font-size="16" text-anchor="middle" fill="#198754">Data Access</text>
    <!-- Data Assess -->
    <rect x="220" y="220" width="630" height="30" fill="#f0f0f0" stroke="#007bff" stroke-width="1"/>
    <text x="530" y="240" font-family="Arial" font-size="16" text-anchor="middle" fill="#007bff">Data Assess</text>
    <!-- Data Address -->
    <rect x="850" y="70" width="320" height="30" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
    <text x="1020" y="90" font-family="Arial" font-size="16" text-anchor="middle" fill="#dc3545">Data Address</text>

    <!-- Pipeline Boxes -->
    <!-- Data Collection -->
    <rect x="60" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="130" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Data Collection</text>
    
    <!-- Data Cleaning -->
    <rect x="220" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="290" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Data Cleaning</text>
    
    <!-- Preprocessing -->
    <rect x="380" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="450" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Preprocessing</text>
    
    <!-- Data Augmentation -->
    <rect x="540" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="610" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Data Augmentation</text>
    
    <!-- Feature Engineering -->
    <rect x="700" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="770" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Feature Engineering</text>
    
    <!-- Model Training -->
    <rect x="860" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="930" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Model Training</text>
    
    <!-- Model Evaluation -->
    <rect x="1020" y="130" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="1090" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Evaluation</text>
    
    <!-- Deployment -->
    <rect x="1020" y="210" width="140" height="60" rx="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="1090" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Deployment</text>
    
    <!-- Connecting Arrows -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
      </marker>
      <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600" />
      </marker>
      <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545" />
      </marker>
    </defs>
    <line x1="200" y1="160" x2="220" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="160" x2="380" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="520" y1="160" x2="540" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="680" y1="160" x2="700" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="840" y1="160" x2="860" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="1000" y1="160" x2="1020" y2="160" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Evaluation to Deployment -->
    <line x1="1090" y1="190" x2="1090" y2="210" stroke="#0066cc" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Evaluation Loop Back to Data Cleaning (Unsuccessful) -->
    <polyline points="1090,130 1090,110 290,110 290,130" fill="none" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
    <text x="650" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#dc3545">If not successful</text>
    
    <!-- Quality Metrics Box (enlarged) -->
    <rect x="60" y="210" width="140" height="50" rx="16" fill="#fff0e6" stroke="#ff6600" stroke-width="2"/>
    <text x="130" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Quality Metrics</text>

    <line x1="200" y1="235" x2="220" y2="235" stroke="#ff6600" stroke-width="1" marker-end="url(#arrowhead-orange)"/>
</svg> 