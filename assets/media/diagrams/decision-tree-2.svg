<?xml version="1.0" encoding="UTF-8"?>
<!-- Generic decision tree with one root-to-leaf rule path highlighted. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 510" width="790" height="510">
<defs><style type="text/css"><![CDATA[
 text { font-family:Segoe UI, Helvetica, Arial, sans-serif; fill:#224466; }
 .t { font-size:26px; font-weight:600; text-anchor:middle; }
 .s { font-size:22px; text-anchor:middle; }
 .x { font-size:18px; text-anchor:middle; }
 .b { font-size:30px; font-weight:700; text-anchor:middle; }
 .l { text-anchor:start; }
 .r { text-anchor:end; }
 .m { font-family:Consolas, Menlo, monospace; }
]]></style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#224466"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa500"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c8aa3"/></marker>
</defs>
<line x1="340.0" y1="125.0" x2="205.0" y2="215.0" stroke="#224466" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="245.0" y="165.0" class="s">yes</text>
<line x1="450.0" y1="125.0" x2="555.0" y2="215.0" stroke="#ffa500" stroke-width="4" marker-end="url(#ao)"/>
<text x="530.0" y="165.0" class="s" style="fill:#ffa500">no</text>
<line x1="525.0" y1="295.0" x2="445.0" y2="380.0" stroke="#ffa500" stroke-width="4" marker-end="url(#ao)"/>
<text x="455.0" y="335.0" class="s" style="fill:#ffa500">yes</text>
<line x1="615.0" y1="295.0" x2="695.0" y2="380.0" stroke="#224466" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="685.0" y="335.0" class="s">no</text>
<rect x="285" y="45" width="220" height="78" rx="8" fill="#fff4e0" stroke="#ffa500" stroke-width="3"/>
<text x="395.0" y="92.0" class="t">x1 ≤ 2.5</text>
<rect x="110" y="218" width="160" height="74" rx="8" fill="#e8f0f8" stroke="#224466" stroke-width="2"/>
<text x="190.0" y="263.0" class="t">no</text>
<rect x="460" y="218" width="220" height="74" rx="8" fill="#fff4e0" stroke="#ffa500" stroke-width="3"/>
<text x="570.0" y="263.0" class="t">x2 ≤ 1.0</text>
<rect x="350" y="385" width="160" height="74" rx="8" fill="#fff4e0" stroke="#ffa500" stroke-width="3"/>
<text x="430.0" y="430.0" class="t">yes</text>
<rect x="630" y="385" width="140" height="74" rx="8" fill="#e8f0f8" stroke="#224466" stroke-width="2"/>
<text x="700.0" y="430.0" class="t">no</text>
</svg>
