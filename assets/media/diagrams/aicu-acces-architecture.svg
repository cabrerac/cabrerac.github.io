<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <defs>
    <style>
      .section-title { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 18px; fill: #111; font-weight: 700; }
      .layer-title   { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 15px; fill: #111; font-weight: 700; }
      .layer-title-l { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 15px; fill: #ffffff; font-weight: 700; }
      .tech-text     { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; fill: #333; }
      .tech-text-l   { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; fill: #f5f5f5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- ============== CONSUMERS ============== -->
  <g>
    <rect x="60"  y="60" width="200" height="60" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="6"/>
    <text x="160" y="90" class="layer-title" text-anchor="middle">Data quality tasks</text>
    <text x="160" y="110" class="tech-text" text-anchor="middle">Assess</text>

    <rect x="280" y="60" width="200" height="60" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="6"/>
    <text x="380" y="90" class="layer-title" text-anchor="middle">Data analytics tasks</text>
    <text x="380" y="110" class="tech-text" text-anchor="middle">Assess</text>

    <rect x="500" y="60" width="200" height="60" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="6"/>
    <text x="600" y="90" class="layer-title" text-anchor="middle">ML models</text>
    <text x="600" y="110" class="tech-text" text-anchor="middle">Address</text>

    <rect x="720" y="60" width="220" height="60" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="6"/>
    <text x="830" y="90" class="layer-title" text-anchor="middle">Research studies</text>
    <text x="830" y="110" class="tech-text" text-anchor="middle">Address</text>
  </g>

  <!-- ============== aicu-access LIBRARY ============== -->
  <rect x="60" y="150" width="880" height="360" fill="#F4F8FC" stroke="#0D47A1" stroke-width="3" rx="10"/>
  <text x="500" y="190" class="section-title" text-anchor="middle">aicu-access</text>

  <!-- Layer 1: Public facade -->
  <rect x="100" y="220" width="800" height="50" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="6"/>
  <text x="500" y="251" class="layer-title" text-anchor="middle">Public facade - Library API</text>

  <!-- Layer 2: Concept harmonisation -->
  <rect x="100" y="280" width="800" height="60" fill="#BBDEFB" stroke="#1565C0" stroke-width="2" rx="6"/>
  <text x="500" y="305" class="layer-title" text-anchor="middle">Concept harmonisation</text>
  <text x="500" y="325" class="tech-text"  text-anchor="middle">pyicu - ricu Python library</text>

  <!-- Layer 3: Query engine -->
  <rect x="100" y="350" width="800" height="60" fill="#64B5F6" stroke="#1565C0" stroke-width="2" rx="6"/>
  <text x="500" y="375" class="layer-title" text-anchor="middle">Query engine</text>
  <text x="500" y="395" class="tech-text"  text-anchor="middle">DuckDB - SQL query engine</text>

  <!-- Layer 4: Table format -->
  <rect x="100" y="420" width="800" height="50" fill="#1E88E5" stroke="#0D47A1" stroke-width="2" rx="6"/>
  <text x="500" y="441" class="layer-title-l" text-anchor="middle">Table format</text>
  <text x="500" y="459" class="tech-text-l"  text-anchor="middle">Delta Lake - Dataset metadata (ACID, schema evolution, time travel, partitioning)</text>

  <!-- ============== DATA SOURCES ============== -->
  <g>
    <rect x="60"  y="540" width="140" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="130" y="560" class="layer-title" text-anchor="middle">aICU</text>
    <text x="130" y="580" class="tech-text"  text-anchor="middle">parquet</text>

    <rect x="210" y="540" width="140" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="280" y="560" class="layer-title" text-anchor="middle">MIMIC-IV</text>
    <text x="280" y="580" class="tech-text"  text-anchor="middle">parquet</text>

    <rect x="360" y="540" width="140" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="430" y="560" class="layer-title" text-anchor="middle">MIMIC-III</text>
    <text x="430" y="580" class="tech-text"  text-anchor="middle">csv.gz</text>

    <rect x="510" y="540" width="140" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="580" y="560" class="layer-title" text-anchor="middle">eICU</text>
    <text x="580" y="580" class="tech-text"  text-anchor="middle">csv</text>

    <rect x="660" y="540" width="140" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="730" y="560" class="layer-title" text-anchor="middle">HiRID</text>
    <text x="730" y="580" class="tech-text"  text-anchor="middle">csv.gz</text>

    <rect x="810" y="540" width="130" height="60" fill="#FFF59D" stroke="#F57F17" stroke-width="2" rx="6"/>
    <text x="875" y="560" class="layer-title" text-anchor="middle">AUMCdb</text>
    <text x="875" y="580" class="tech-text"  text-anchor="middle">csv</text>
  </g>

  <text x="500" y="630" class="section-title" text-anchor="middle">Data sources</text>
</svg>
