<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="440" fill="#ffffff"/>

  <!-- mainframe cabinet -->
  <rect x="60" y="70" width="200" height="240" rx="8" fill="#dbe5f1" stroke="#2f5597" stroke-width="2"/>
  <!-- tape reels -->
  <circle cx="110" cy="120" r="26" fill="#ffffff" stroke="#2f5597" stroke-width="3"/>
  <circle cx="110" cy="120" r="6" fill="#2f5597"/>
  <circle cx="210" cy="120" r="26" fill="#ffffff" stroke="#2f5597" stroke-width="3"/>
  <circle cx="210" cy="120" r="6" fill="#2f5597"/>
  <line x1="136" y1="120" x2="184" y2="120" stroke="#2f5597" stroke-width="2"/>
  <!-- console lights -->
  <rect x="90" y="170" width="140" height="60" rx="4" fill="#ffffff" stroke="#9aa7b4"/>
  <circle cx="108" cy="186" r="5" fill="#548235"/>
  <circle cx="128" cy="186" r="5" fill="#c55a11"/>
  <circle cx="148" cy="186" r="5" fill="#548235"/>
  <circle cx="168" cy="186" r="5" fill="#c55a11"/>
  <circle cx="188" cy="186" r="5" fill="#548235"/>
  <rect x="100" y="204" width="120" height="8" rx="2" fill="#e2efda" stroke="#9aa7b4"/>
  <!-- slots -->
  <rect x="90" y="250" width="140" height="10" rx="2" fill="#ffffff" stroke="#9aa7b4"/>
  <rect x="90" y="270" width="140" height="10" rx="2" fill="#ffffff" stroke="#9aa7b4"/>
  <text x="160" y="335" text-anchor="middle" font-size="15" fill="#5a6b7b">Mainframe</text>

  <!-- structured ledger / table -->
  <g transform="translate(310,90)">
    <rect x="0" y="0" width="170" height="190" rx="6" fill="#f6f8fa" stroke="#548235" stroke-width="2"/>
    <line x1="0" y1="34" x2="170" y2="34" stroke="#548235"/>
    <line x1="0" y1="74" x2="170" y2="74" stroke="#9aa7b4"/>
    <line x1="0" y1="114" x2="170" y2="114" stroke="#9aa7b4"/>
    <line x1="0" y1="154" x2="170" y2="154" stroke="#9aa7b4"/>
    <line x1="85" y1="0" x2="85" y2="190" stroke="#9aa7b4"/>
    <text x="42" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">account</text>
    <text x="128" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">credit</text>
    <text x="42" y="60" text-anchor="middle" font-size="12" fill="#2f5597">001</text>
    <text x="128" y="60" text-anchor="middle" font-size="12" fill="#548235">1200</text>
    <text x="42" y="100" text-anchor="middle" font-size="12" fill="#2f5597">002</text>
    <text x="128" y="100" text-anchor="middle" font-size="12" fill="#548235">980</text>
    <text x="42" y="140" text-anchor="middle" font-size="12" fill="#2f5597">003</text>
    <text x="128" y="140" text-anchor="middle" font-size="12" fill="#548235">540</text>
    <text x="42" y="180" text-anchor="middle" font-size="12" fill="#2f5597">004</text>
    <text x="128" y="180" text-anchor="middle" font-size="12" fill="#548235">760</text>
    <text x="85" y="335" text-anchor="middle" font-size="15" fill="#5a6b7b" transform="translate(0,-330)"></text>
  </g>
  <text x="395" y="300" text-anchor="middle" font-size="15" fill="#5a6b7b">Structured records</text>

  <text x="260" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Transactions that must stay consistent</text>
</svg>
