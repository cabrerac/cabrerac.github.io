<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <!-- ETL -->
  <text x="60" y="90" font-size="22" font-weight="bold" fill="#1f2d3d">ETL</text>
  <text x="60" y="116" font-size="14" fill="#5a6b7b">transform before load (data warehouse)</text>
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="140" height="56" rx="6" fill="#dbe5f1" stroke="#2f5597"/><text x="70" y="34" text-anchor="middle" font-size="15">Extract</text>
    <rect x="200" y="0" width="160" height="56" rx="6" fill="#fbe5d6" stroke="#c55a11"/><text x="280" y="34" text-anchor="middle" font-size="15">Transform</text>
    <rect x="420" y="0" width="140" height="56" rx="6" fill="#dbe5f1" stroke="#2f5597"/><text x="490" y="34" text-anchor="middle" font-size="15">Load</text>
    <rect x="600" y="0" width="180" height="56" rx="6" fill="#e2efda" stroke="#548235"/><text x="690" y="28" text-anchor="middle" font-size="15">Warehouse</text>
    <text x="690" y="46" text-anchor="middle" font-size="11" fill="#5a6b7b">clean, schema-on-write</text>
    <g stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="140" y1="28" x2="196" y2="28"/>
      <line x1="360" y1="28" x2="416" y2="28"/>
      <line x1="560" y1="28" x2="596" y2="28"/>
    </g>
  </g>

  <line x1="60" y1="290" x2="900" y2="290" stroke="#e0e0e0"/>

  <!-- ELT -->
  <text x="60" y="350" font-size="22" font-weight="bold" fill="#1f2d3d">ELT</text>
  <text x="60" y="376" font-size="14" fill="#5a6b7b">load raw, transform at query time (lakehouse)</text>
  <g transform="translate(60,400)">
    <rect x="0" y="0" width="140" height="56" rx="6" fill="#dbe5f1" stroke="#2f5597"/><text x="70" y="34" text-anchor="middle" font-size="15">Extract</text>
    <rect x="200" y="0" width="140" height="56" rx="6" fill="#dbe5f1" stroke="#2f5597"/><text x="270" y="34" text-anchor="middle" font-size="15">Load</text>
    <rect x="400" y="0" width="180" height="56" rx="6" fill="#e2efda" stroke="#548235"/><text x="490" y="28" text-anchor="middle" font-size="15">Lake / Parquet</text>
    <text x="490" y="46" text-anchor="middle" font-size="11" fill="#5a6b7b">raw, schema-on-read</text>
    <rect x="640" y="0" width="180" height="56" rx="6" fill="#fbe5d6" stroke="#c55a11"/><text x="730" y="28" text-anchor="middle" font-size="15">Transform</text>
    <text x="730" y="46" text-anchor="middle" font-size="11" fill="#5a6b7b">engine on read</text>
    <g stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="140" y1="28" x2="196" y2="28"/>
      <line x1="340" y1="28" x2="396" y2="28"/>
      <line x1="580" y1="28" x2="636" y2="28"/>
    </g>
  </g>
</svg>
