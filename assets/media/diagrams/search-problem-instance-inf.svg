    <text x="115" y="220" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">70</text>
    
    <line x1="185" y1="195" x2="215" y2="233" stroke="#888" stroke-width="2"/>
    <text x="185" y="220" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">90</text>
    
    <line x1="290" y1="195" x2="235" y2="233" stroke="#888" stroke-width="2"/>
    <text x="275" y="220" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">85</text>
    
    <line x1="310" y1="195" x2="338" y2="233" stroke="#888" stroke-width="2"/>
