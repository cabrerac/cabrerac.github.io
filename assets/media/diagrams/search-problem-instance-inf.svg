    <text x="115" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">71</text>
    
    <line x1="225" y1="122" x2="175" y2="158" stroke="#888" stroke-width="2"/>
    <text x="180" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">151</text>
    
    <line x1="225" y1="122" x2="290" y2="158" stroke="#888" stroke-width="2"/>
    <text x="275" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">99</text>
    
    <line x1="350" y1="122" x2="288" y2="160" stroke="#888" stroke-width="2"/>
    <text x="330" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">80</text>
    
    <line x1="350" y1="122" x2="413" y2="158" stroke="#888" stroke-width="2"/>
    <text x="400" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">97</text>
    
    <line x1="500" y1="122" x2="437" y2="160" stroke="#888" stroke-width="2"/>
    <text x="480" y="145" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">138</text>
    
    <!-- Row 2 connections -->
    <line x1="197" y1="175" x2="278" y2="175" stroke="#888" stroke-width="2"/>
    <text x="240" y="165" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">101</text>
    
    <line x1="322" y1="175" x2="403" y2="175" stroke="#888" stroke-width="2"/>
    <text x="360" y="165" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">111</text>
    
