    <text x="235" y="315" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">113</text>
    
    <line x1="322" y1="325" x2="403" y2="325" stroke="#888" stroke-width="2"/>
    <text x="360" y="315" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">108</text>
    
    <!-- Start and Goal -->
