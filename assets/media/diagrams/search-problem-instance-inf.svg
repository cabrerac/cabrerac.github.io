    <!-- Row 1 -->
    <circle cx="100" cy="100" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="100" y="100" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">A</text>
    
    <circle cx="225" cy="100" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="225" y="100" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">B</text>
    
    <circle cx="350" cy="100" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="350" y="100" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">C</text>
    
    <circle cx="500" cy="100" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="500" y="100" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">D</text>
    
    <!-- Row 2 -->
