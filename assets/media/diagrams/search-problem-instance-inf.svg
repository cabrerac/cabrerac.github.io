<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="#224466" font-size="20" font-weight="bold">
        Search Problem: Finding Path Between Cities
    </text>
    
    <!-- Background -->
    <rect x="50" y="60" width="500" height="300" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="5" ry="5"/>

