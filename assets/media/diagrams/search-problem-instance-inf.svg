    <line x1="247" y1="250" x2="328" y2="250" stroke="#888" stroke-width="2"/>
    <text x="290" y="240" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">98</text>
    
    <!-- Row 3 to Row 4 connections -->
