    <text x="100" y="100" text-anchor="middle" fill="white" font-size="18" font-weight="bold">A</text>
    
    <circle cx="425" cy="325" r="25" fill="#f44336" stroke="#224466" stroke-width="3"/>
    <text x="425" y="325" text-anchor="middle" fill="white" font-size="18" font-weight="bold">M</text>
    
    <!-- Aerial distances (Manhattan heuristic) -->
    <text x="100" y="115" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">450</text>
    <text x="225" y="115" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">375</text>
    <text x="350" y="115" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">290</text>
    <text x="500" y="115" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">270</text>
    
    <text x="175" y="190" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">330</text>
    <text x="300" y="190" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">250</text>
    <text x="425" y="190" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">150</text>
    
    <text x="100" y="265" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">290</text>
    <text x="225" y="265" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">200</text>
    <text x="350" y="265" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">90</text>
    
    <text x="175" y="340" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">210</text>
    <text x="300" y="340" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">125</text>
    <text x="425" y="340" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">0</text>
    
    <!-- Legend -->
    <rect x="50" y="370" width="500" height="30" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="5" ry="5"/>
    
    <circle cx="60" cy="385" r="10" fill="#4a90e2" stroke="#224466" stroke-width="1"/>
    <text x="100" y="390" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">StartA</text>
    
    <circle cx="180" cy="385" r="10" fill="#f44336" stroke="#224466" stroke-width="1"/>
    <text x="220" y="390" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">Goal</text>
    
    <text x="320" y="390" text-anchor="middle" fill="#d24939" font-size="14" font-weight="bold">Road distance</text>
    
    <text x="470" y="390" text-anchor="middle" fill="#9c27b0" font-size="14" font-weight="bold">Aerial distance to goal</text>
</svg> 