    <text x="120" y="295" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">75</text>
    
    <line x1="235" y1="270" x2="288" y2="308" stroke="#888" stroke-width="2"/>
    <text x="285" y="295" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">91</text>
    
    <line x1="360" y1="270" x2="413" y2="308" stroke="#888" stroke-width="2"/>
    <text x="410" y="295" text-anchor="middle" fill="#d24939" font-size="12" font-weight="bold">72</text>
    
