    <circle cx="425" cy="175" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="425" y="175" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">G</text>
    
    <!-- Row 3 -->
    <circle cx="100" cy="250" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="100" y="250" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">H</text>
    
    <circle cx="225" cy="250" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="225" y="250" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">I</text>
    
    <circle cx="350" cy="250" r="22" fill="#f0f0f0" stroke="#224466" stroke-width="2"/>
    <text x="350" y="250" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">J</text>
    
