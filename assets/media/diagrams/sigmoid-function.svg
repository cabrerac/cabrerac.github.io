<svg width="360" height="175" viewBox="0 0 360 175" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowx)" marker-start="url(#arrowxneg)"/>
  <line x1="180" y1="140" x2="180" y2="25" stroke="black" stroke-width="2" marker-end="url(#arrowyup)"/>
  
  <!-- Sigmoid function curve (accurate, many points) -->
  <polyline fill="none" stroke="blue" stroke-width="3" points="
