  <!-- Horizontal asymptotes -->
  <line x1="30" y1="34" x2="330" y2="34" stroke="gray" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="30" y1="130" x2="330" y2="130" stroke="gray" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Vertical dashed line at x=0 -->
  <line x1="180" y1="130" x2="180" y2="34" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- x-ticks and labels -->
  <text x="175" y="155" font-size="16" fill="black">0</text>
  
  <!-- y-ticks and labels -->
  <text x="165" y="125" font-size="16" fill="black">0</text>
  <text x="165" y="40" font-size="16" fill="black">1</text>
  
  <!-- Axis labels -->
  <text x="195" y="50" font-size="18" fill="black">σ(x)</text>
  <text x="340" y="135" font-size="18" fill="black">x</text>
  
  <!-- Function label -->
  <text x="220" y="60" font-size="14" fill="blue">σ(x) = 1/(1 + e<sup>-x</sup>)</text>
  
  <!-- Arrowhead marker definitions -->
  <defs>
    <!-- Positive x-axis arrow -->
    <marker id="arrowx" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="black" />
    </marker>
    <!-- Negative x-axis arrow -->
    <marker id="arrowxneg" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="360" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 L7,5 Z" fill="black" />
    </marker>
    <!-- Upward y-axis arrow -->
    <marker id="arrowyup" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="360" markerUnits="strokeWidth">
      <path d="M0,10 L5,0 L10,10 L5,7 Z" fill="black" />
    </marker>
  </defs>
</svg> 