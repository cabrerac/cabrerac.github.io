<?xml version="1.0" encoding="UTF-8"?>
<!-- Show three texts against a keyword list, with one false yes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <defs>
    <style type="text/css"><![CDATA[
      .label { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:22px; font-weight:600; fill:#224466; text-anchor:middle; }
      .cell { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:20px; font-weight:600; fill:#224466; text-anchor:middle; }
      .cell-light { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:20px; font-weight:600; fill:#ffffff; text-anchor:middle; }
      .note { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:18px; fill:#224466; text-anchor:middle; }
      .left { text-anchor:start; }
      .frame { fill:none; stroke:#224466; stroke-width:2; }
    ]]></style>
  </defs>

  <text x="380" y="36" class="label">A keyword list on three texts</text>
  <rect x="230" y="58" width="300" height="44" fill="#0e73b8" rx="6"/>
  <text x="380" y="88" class="cell-light">list: free, winner, winners</text>
  <text x="160" y="150" class="label">text</text>
  <text x="520" y="150" class="label">answer</text>
  <text x="650" y="150" class="label">mark</text>
  <rect x="40" y="180" width="400" height="52" fill="#f4f6f8"/>
  <text x="60" y="214" class="cell left" xml:space="preserve"><tspan font-weight="700" fill="#0e73b8">Free</tspan><tspan font-weight="400" fill="#224466"> entry, one </tspan><tspan font-weight="700" fill="#0e73b8">winner</tspan></text>
  <rect x="470" y="180" width="100" height="52" fill="#0e73b8"/>
  <text x="520" y="214" class="cell-light">yes</text>
  <rect x="600" y="180" width="100" height="52" fill="#e8f2fa"/>
  <text x="650" y="214" class="cell">yes</text>
  <rect x="40" y="260" width="400" height="52" fill="#f4f6f8"/>
  <text x="60" y="294" class="cell left" xml:space="preserve"><tspan font-weight="400" fill="#224466">Meeting moved to noon</tspan></text>
  <rect x="470" y="260" width="100" height="52" fill="#d6e4f0"/>
  <text x="520" y="294" class="cell">no</text>
  <rect x="600" y="260" width="100" height="52" fill="#e8f2fa"/>
  <text x="650" y="294" class="cell">no</text>
  <rect x="40" y="340" width="400" height="52" fill="#f4f6f8"/>
  <text x="60" y="374" class="cell left" xml:space="preserve"><tspan font-weight="700" fill="#0e73b8">Free</tspan><tspan font-weight="400" fill="#224466"> parking for staff</tspan></text>
  <rect x="470" y="340" width="100" height="52" fill="#0e73b8"/>
  <text x="520" y="374" class="cell-light">yes</text>
  <rect x="600" y="340" width="100" height="52" fill="#e8f2fa"/>
  <text x="650" y="374" class="cell">no</text>
  <rect x="465" y="335" width="240" height="62" fill="none" stroke="#c0392b" stroke-width="3" rx="6"/>
  <text x="380" y="470" class="note">The third text is a false yes: free is there, the topic is not.</text>
</svg>
