<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="320" xmlns="http://www.w3.org/2000/svg">
    <rect width="1180" height="320" fill="#ffffff"/>

    <text x="590" y="36" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#224466">Big Data Pipeline</text>
    <text x="590" y="58" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666666">Three As: Access / Assess / Address</text>

    <!-- Access band -->
    <rect x="40" y="72" width="300" height="28" fill="#d1e7dd" stroke="#198754" stroke-width="1"/>
    <text x="190" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#198754">Access</text>

    <!-- Assess band -->
    <rect x="360" y="72" width="420" height="28" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
    <text x="570" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#0d6efd">Assess</text>

    <!-- Address band -->
    <rect x="800" y="72" width="340" height="28" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
    <text x="970" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#dc3545">Address</text>

    <!-- Stage boxes -->
    <rect x="40" y="118" width="130" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="105" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Data sources</text>

    <rect x="190" y="118" width="130" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="255" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Harmonise</text>

    <rect x="360" y="118" width="120" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="420" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Ethics audit</text>

    <rect x="500" y="118" width="120" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="560" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Store</text>

    <rect x="640" y="118" width="120" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="700" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Process</text>

    <rect x="800" y="118" width="120" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="860" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Ingest</text>

    <rect x="940" y="118" width="120" height="56" rx="8" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="1000" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#333333">Analytics</text>

    <rect x="1080" y="118" width="60" height="56" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="1110" y="146" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333333">Brief</text>

    <!-- Arrows (defs must come before lines that reference markers) -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
        </marker>
    </defs>

    <line x1="170" y1="146" x2="188" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="320" y1="146" x2="358" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="480" y1="146" x2="498" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="620" y1="146" x2="638" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="760" y1="146" x2="798" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="920" y1="146" x2="938" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1060" y1="146" x2="1078" y2="146" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Lab vs production -->
    <rect x="40" y="200" width="520" height="44" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="300" y="222" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#495057">In this course (Colab / laptop)</text>

    <rect x="580" y="200" width="560" height="44" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
    <text x="860" y="222" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#495057">In production (cloud / clusters)</text>

    <!-- Project requirements anchor -->
    <rect x="40" y="260" width="1100" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="590" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32">Governance thread</text>
</svg>
