<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="250" y="30" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">
        General Problem Solver (GPS)
    </text>
    
    <!-- Initial State -->
    <rect x="50" y="100" width="100" height="60" rx="10" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="100" y="135" text-anchor="middle" fill="#224466" font-size="12">Initial State</text>
    
    <!-- Goal State -->
    <rect x="350" y="100" width="100" height="60" rx="10" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" fill="#224466" font-size="12">Goal State</text>
    
    <!-- Difference Detection -->
    <rect x="200" y="50" width="100" height="40" rx="10" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="250" y="75" text-anchor="middle" fill="#224466" font-size="12">Difference Detection</text>
    
    <!-- Operator Selection -->
    <rect x="200" y="170" width="100" height="40" rx="10" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="250" y="195" text-anchor="middle" fill="#224466" font-size="12">Operator Selection</text>
    
    <!-- Application -->
    <rect x="200" y="290" width="100" height="40" rx="10" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="250" y="315" text-anchor="middle" fill="#224466" font-size="12">Application</text>
    
    <!-- Connections -->
    <line x1="150" y1="130" x2="200" y2="90" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="90" x2="350" y2="130" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="90" x2="200" y2="170" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="210" x2="200" y2="290" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="330" x2="150" y2="130" stroke="#224466" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Arrows -->
    <path d="M 195 90 L 200 85 L 205 90" fill="none" stroke="#224466" stroke-width="2"/>
    <path d="M 195 170 L 200 165 L 205 170" fill="none" stroke="#224466" stroke-width="2"/>
    <path d="M 195 290 L 200 285 L 205 290" fill="none" stroke="#224466" stroke-width="2"/>
    
    <!-- Example: Tower of Hanoi -->
    <text x="250" y="380" text-anchor="middle" fill="#224466" font-size="12">
        Example: Tower of Hanoi Problem
    </text>
    
    <!-- Legend -->
    <rect x="50" y="350" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="75" y="362" fill="#224466" font-size="10">States</text>
    
    <rect x="150" y="350" width="15" height="15" fill="#ffa500" stroke="#224466" stroke-width="2"/>
    <text x="175" y="362" fill="#224466" font-size="10">Processes</text>
</svg> 