<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="460" fill="#ffffff"/>

  <!-- stage headers -->
  <text x="110" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Input splits</text>
  <text x="330" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5597">Map</text>
  <text x="555" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#c55a11">Shuffle</text>
  <text x="790" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#548235">Reduce</text>

  <!-- input partitions -->
  <g>
    <rect x="40" y="70" width="140" height="60" rx="6" fill="#f6f8fa" stroke="#9aa7b4"/>
    <text x="110" y="105" text-anchor="middle" font-size="14" fill="#1f2d3d">mes=01</text>
    <rect x="40" y="200" width="140" height="60" rx="6" fill="#f6f8fa" stroke="#9aa7b4"/>
    <text x="110" y="235" text-anchor="middle" font-size="14" fill="#1f2d3d">mes=02</text>
    <rect x="40" y="330" width="140" height="60" rx="6" fill="#f6f8fa" stroke="#9aa7b4"/>
    <text x="110" y="365" text-anchor="middle" font-size="14" fill="#1f2d3d">mes=03</text>
  </g>

  <!-- map outputs: emit (dpto, peso) pairs -->
  <g font-size="12" font-family="monospace">
    <rect x="250" y="62" width="160" height="76" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
    <text x="262" y="84" fill="#2f5597">(52, 1.2)</text>
    <text x="262" y="104" fill="#c55a11">(11, 0.8)</text>
    <text x="262" y="124" fill="#2f5597">(52, 1.5)</text>

    <rect x="250" y="192" width="160" height="76" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
    <text x="262" y="214" fill="#c55a11">(11, 0.9)</text>
    <text x="262" y="234" fill="#2f5597">(52, 1.1)</text>
    <text x="262" y="254" fill="#c55a11">(11, 1.0)</text>

    <rect x="250" y="322" width="160" height="76" rx="6" fill="#dbe5f1" stroke="#2f5597"/>
    <text x="262" y="344" fill="#2f5597">(52, 0.7)</text>
    <text x="262" y="364" fill="#c55a11">(11, 1.3)</text>
  </g>

  <!-- shuffle buckets grouped by key -->
  <g font-size="12" font-family="monospace">
    <rect x="480" y="80" width="170" height="120" rx="6" fill="#fbe5d6" stroke="#2f5597"/>
    <text x="490" y="100" font-family="Helvetica" font-weight="bold" fill="#2f5597">dpto 52</text>
    <text x="490" y="122" fill="#1f2d3d">[1.2, 1.5,</text>
    <text x="490" y="142" fill="#1f2d3d"> 1.1, 0.7]</text>

    <rect x="480" y="250" width="170" height="120" rx="6" fill="#fbe5d6" stroke="#c55a11"/>
    <text x="490" y="270" font-family="Helvetica" font-weight="bold" fill="#c55a11">dpto 11</text>
    <text x="490" y="292" fill="#1f2d3d">[0.8, 0.9,</text>
    <text x="490" y="312" fill="#1f2d3d"> 1.0, 1.3]</text>
  </g>

  <!-- reduce outputs -->
  <g font-size="12">
    <rect x="715" y="86" width="170" height="108" rx="6" fill="#e2efda" stroke="#548235"/>
    <text x="800" y="120" text-anchor="middle" font-family="Helvetica" font-weight="bold" fill="#548235">dpto 52</text>
    <text x="800" y="146" text-anchor="middle" fill="#1f2d3d">conteo = 4</text>
    <text x="800" y="168" text-anchor="middle" fill="#1f2d3d">suma = 4.5</text>

    <rect x="715" y="256" width="170" height="108" rx="6" fill="#e2efda" stroke="#548235"/>
    <text x="800" y="290" text-anchor="middle" font-family="Helvetica" font-weight="bold" fill="#548235">dpto 11</text>
    <text x="800" y="316" text-anchor="middle" fill="#1f2d3d">conteo = 4</text>
    <text x="800" y="338" text-anchor="middle" fill="#1f2d3d">suma = 4.0</text>
  </g>

  <!-- arrows -->
  <g stroke="#9aa7b4" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M185 100 L245 100"/>
    <path d="M185 230 L245 230"/>
    <path d="M185 360 L245 360"/>
    <!-- map to shuffle -->
    <path d="M415 100 L475 130"/>
    <path d="M415 230 L475 150"/>
    <path d="M415 230 L475 300"/>
    <path d="M415 360 L475 320"/>
    <!-- shuffle to reduce -->
    <path d="M655 140 L710 140"/>
    <path d="M655 310 L710 310"/>
  </g>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <text x="460" y="440" text-anchor="middle" font-size="15" fill="#5a6b7b">Group by key, then aggregate each group in parallel</text>
</svg>
