<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="200" y="30" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">
        Hebbian Learning Rule
    </text>
    
    <!-- Neurons -->
    <circle cx="100" cy="150" r="20" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <circle cx="300" cy="150" r="20" fill="#50c878" stroke="#224466" stroke-width="2"/>
    
    <!-- Connection -->
    <line x1="120" y1="150" x2="280" y2="150" stroke="#224466" stroke-width="2"/>
    
    <!-- Weight update arrow -->
    <path d="M 200 100 L 200 80 L 220 90 L 200 100" fill="#224466"/>
    <text x="200" y="70" text-anchor="middle" fill="#224466" font-size="12">Δw</text>
    
    <!-- Formula -->
    <text x="200" y="200" text-anchor="middle" fill="#224466" font-size="14">
        Δw = η · x · y
    </text>
    
    <!-- Legend -->
    <text x="100" y="100" text-anchor="middle" fill="#224466" font-size="12">Presynaptic</text>
    <text x="300" y="100" text-anchor="middle" fill="#224466" font-size="12">Postsynaptic</text>
    
    <!-- Time sequence -->
    <g transform="translate(50, 250)">
        <line x1="0" y1="0" x2="300" y2="0" stroke="#224466" stroke-width="1"/>
        <circle cx="50" cy="0" r="3" fill="#4a90e2"/>
        <circle cx="150" cy="0" r="3" fill="#4a90e2"/>
        <circle cx="250" cy="0" r="3" fill="#4a90e2"/>
        <text x="0" y="20" fill="#224466" font-size="10">t₁</text>
        <text x="100" y="20" fill="#224466" font-size="10">t₂</text>
        <text x="200" y="20" fill="#224466" font-size="10">t₃</text>
    </g>
    
    <!-- Connection strength indicators -->
    <line x1="200" y1="120" x2="200" y2="180" stroke="#224466" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="210" y="150" fill="#224466" font-size="10">w</text>
</svg> 