<?xml version="1.0" encoding="UTF-8"?>
<!-- Output layer: linear map to the vocabulary, then softmax. Own diagram, no numbers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
<defs><style type="text/css"><![CDATA[
 text { font-family:Segoe UI, Helvetica, Arial, sans-serif; fill:#224466; }
 .t { font-size:26px; font-weight:600; text-anchor:middle; }
 .s { font-size:22px; text-anchor:middle; }
 .b { font-size:30px; font-weight:700; text-anchor:middle; }
 .w { fill:#ffffff; }
 .l { text-anchor:start; }
 .m { font-family:Consolas, Menlo, monospace; }
]]></style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#224466"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa500"/></marker>
</defs>
<rect x="20" y="150" width="140" height="60" rx="8" fill="#0e73b8" stroke="#224466" stroke-width="2"/>
<text x="90.0" y="175.0" class="s" style="fill:#fff">h (last</text>
<text x="90.0" y="199.0" class="s" style="fill:#fff">position)</text>
<line x1="162" y1="180" x2="216" y2="180" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<rect x="220" y="140" width="150" height="80" rx="8" fill="#e8f0f8" stroke="#224466" stroke-width="2"/>
<text x="295.0" y="175.0" class="s">Linear</text>
<text x="295.0" y="199.0" class="s">d → |V|</text>
<line x1="372" y1="180" x2="420" y2="180" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<rect x="424" y="150" width="110" height="60" rx="8" fill="#ffa500" stroke="#224466" stroke-width="2"/>
<text x="479.0" y="187.0" class="s" style="fill:#fff">softmax</text>
<line x1="536" y1="180" x2="580" y2="180" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<text x="590" y="120" class="s l">P(estación)</text>
<text x="590" y="160" class="s l">P(casa)</text>
<text x="590" y="200" class="s l">P(tierra)</text>
<text x="590" y="240" class="s l">P(…)</text>
<text x="330" y="300" class="s">one logit per token in V, then probabilities that sum to 1</text>
</svg>
