<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" fill="#224466" font-size="16" font-weight="bold">
        Non-Informed Search Algorithms
    </text>
    
    <!-- BFS Section -->
    <text x="150" y="60" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">
        Breadth-First Search (BFS)
    </text>
    
    <!-- BFS Tree -->
    <circle cx="150" cy="100" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="150" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>
    
    <circle cx="100" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="100" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2</text>
    
    <circle cx="200" cy="150" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="200" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>
    
    <circle cx="75" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="75" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <circle cx="125" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="125" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <circle cx="175" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="175" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">6</text>
    
    <circle cx="225" cy="200" r="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="225" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">7</text>
    
    <!-- BFS Connections -->
    <line x1="150" y1="115" x2="100" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="150" y1="115" x2="200" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="75" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="100" y1="165" x2="125" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="175" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="200" y1="165" x2="225" y2="185" stroke="#224466" stroke-width="2"/>
    
    <!-- DFS Section -->
    <text x="450" y="60" text-anchor="middle" fill="#224466" font-size="14" font-weight="bold">
        Depth-First Search (DFS)
    </text>
    
    <!-- DFS Tree -->
    <circle cx="450" cy="100" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="450" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>
    
    <circle cx="400" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="400" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2</text>
    
    <circle cx="500" cy="150" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="500" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="bold">6</text>
    
    <circle cx="375" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="375" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>
    
    <circle cx="425" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="425" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <circle cx="475" cy="200" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="475" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">7</text>
    
    <circle cx="350" cy="250" r="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="350" y="255" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <!-- DFS Connections -->
    <line x1="450" y1="115" x2="400" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="450" y1="115" x2="500" y2="135" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="375" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="400" y1="165" x2="425" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="500" y1="165" x2="475" y2="185" stroke="#224466" stroke-width="2"/>
    <line x1="375" y1="215" x2="350" y2="235" stroke="#224466" stroke-width="2"/>
    
    <!-- Data structures -->
    <text x="150" y="250" text-anchor="middle" fill="#224466" font-size="12" font-style="italic">Uses: Queue (FIFO)</text>
    <text x="450" y="270" text-anchor="middle" fill="#224466" font-size="12" font-style="italic">Uses: Stack (LIFO)</text>    
    <!-- Legend -->
    <rect x="100" y="320" width="15" height="15" fill="#4a90e2" stroke="#224466" stroke-width="2"/>
    <text x="125" y="332" fill="#224466" font-size="12">BFS - Complete, optimal for unit costs</text>
    
    <rect x="100" y="350" width="15" height="15" fill="#50c878" stroke="#224466" stroke-width="2"/>
    <text x="125" y="362" fill="#224466" font-size="12">DFS - Not complete or optimal, memory efficient</text>
</svg> 