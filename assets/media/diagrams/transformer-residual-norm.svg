<?xml version="1.0" encoding="UTF-8"?>
<!-- Residual connection and layer normalisation. Own diagram after Vaswani et al. (2017). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
<defs><style type="text/css"><![CDATA[
 text { font-family:Segoe UI, Helvetica, Arial, sans-serif; fill:#224466; }
 .t { font-size:26px; font-weight:600; text-anchor:middle; }
 .s { font-size:22px; text-anchor:middle; }
 .b { font-size:30px; font-weight:700; text-anchor:middle; }
 .w { fill:#ffffff; }
 .l { text-anchor:start; }
 .m { font-family:Consolas, Menlo, monospace; }
]]></style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#224466"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa500"/></marker>
</defs>
<rect x="40" y="160" width="90" height="50" rx="8" fill="#e8f0f8" stroke="#224466" stroke-width="2"/>
<text x="85.0" y="192.0" class="t">x</text>
<line x1="132" y1="185" x2="196" y2="185" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<rect x="200" y="150" width="180" height="70" rx="8" fill="#0e73b8" stroke="#224466" stroke-width="2"/>
<text x="290.0" y="180.0" class="s" style="fill:#fff">sublayer</text>
<text x="290.0" y="204.0" class="s" style="fill:#fff">(attention or FFN)</text>
<line x1="382" y1="185" x2="440" y2="185" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="462" cy="185" r="20" fill="#e8f0f8" stroke="#224466" stroke-width="2"/>
<text x="462" y="194" class="b">+</text>
<path d="M85 158 L85 80 L462 80 L462 163" fill="none" stroke="#ffa500" stroke-width="3" marker-end="url(#ao)"/>
<text x="270" y="66" class="s" style="fill:#b36b00">residual: keep x</text>
<line x1="484" y1="185" x2="540" y2="185" stroke="#224466" stroke-width="2" marker-end="url(#ar)"/>
<rect x="544" y="155" width="150" height="60" rx="8" fill="#50c878" stroke="#224466" stroke-width="2"/>
<text x="619.0" y="192.0" class="t" style="fill:#fff">LayerNorm</text>
<text x="360" y="290" class="t m">LayerNorm(x + Sublayer(x))</text>
</svg>
