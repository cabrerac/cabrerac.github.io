<svg width="360" height="300" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowx)" marker-start="url(#arrowxneg)"/>
  <line x1="180" y1="255" x2="180" y2="25" stroke="black" stroke-width="2" marker-end="url(#arrowyup)" marker-start="url(#arrowydown)"/>
  <!-- Step function -->
  <polyline points="85,195 180,195 180,60 280,60" fill="none" stroke="red" stroke-width="3"/>
  <!-- Dotted line at y=60 (y=1) -->
  <line x1="180" y1="60" x2="280" y2="60" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="85" y1="195" x2="180" y2="195" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Vertical dashed line at x=180 (x=0) -->
  <line x1="180" y1="195" x2="180" y2="60" stroke="black" stroke-width="1"/>
  <!-- y-ticks and labels -->
  <text x="160" y="65" font-size="16" fill="black">+1</text>
  <text x="185" y="195" font-size="16" fill="black">-1</text>
  <!-- Axis labels -->
  <text x="195" y="50" font-size="18" fill="black">h(x)</text>
  <!-- Arrowhead marker definitions -->
  <defs>
    <!-- Positive x-axis arrow -->
    <marker id="arrowx" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="black" />
    </marker>
    <!-- Negative x-axis arrow -->
    <marker id="arrowxneg" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="360" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 L7,5 Z" fill="black" />
    </marker>
    <!-- Upward y-axis arrow -->
    <marker id="arrowyup" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="360" markerUnits="strokeWidth">
      <path d="M0,10 L5,0 L10,10 L5,7 Z" fill="black" />
    </marker>
    <!-- Downward y-axis arrow -->
    <marker id="arrowydown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="180" markerUnits="strokeWidth">
      <path d="M0,10 L5,0 L10,10 L5,7 Z" fill="black" />
    </marker>
  </defs>
</svg> 