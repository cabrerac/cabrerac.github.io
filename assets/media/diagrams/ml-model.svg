<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="250" fill="#f5f5f5"/>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Machine Learning Model</text>
    
    <!-- Input Features Box -->
    <rect x="50" y="100" width="200" height="100" rx="10" fill="#4CAF50" stroke="#333" stroke-width="2"/>
    <text x="150" y="130" font-family="Arial" font-size="18" text-anchor="middle" fill="white" style="font-weight: bold">Input Features</text>
    <text x="150" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="white">(Square footage,</text>
    <text x="150" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="white">bedrooms, location)</text>
    
    <!-- Model Box -->
    <rect x="300" y="100" width="200" height="100" rx="10" fill="#2196F3" stroke="#333" stroke-width="2"/>
    <text x="400" y="150" font-family="Arial" font-size="18" text-anchor="middle" fill="white" style="font-weight: bold">Trained Model</text>
    
    <!-- Predictions Box -->
    <rect x="550" y="100" width="200" height="100" rx="10" fill="#FF9800" stroke="#333" stroke-width="2"/>
    <text x="650" y="130" font-family="Arial" font-size="18" text-anchor="middle" fill="white" style="font-weight: bold">Predictions</text>
    <text x="650" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="white">(House price,</text>
    <text x="650" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="white">image class)</text>
    
    <!-- Arrows -->
    <path d="M250 150 L300 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M500 150 L550 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg> 