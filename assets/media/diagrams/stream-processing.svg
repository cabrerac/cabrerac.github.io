<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">Stream processing</text>

  <!-- Event timeline -->
  <line x1="60" y1="120" x2="860" y2="120" stroke="#9aa7b4" stroke-width="2"/>
  <polygon points="850,115 865,120 850,125" fill="#9aa7b4"/>
  <text x="460" y="100" text-anchor="middle" font-size="12" fill="#5a6b7b">Unbounded event timeline (never ends)</text>

  <!-- Events -->
  <g>
    <circle cx="120" cy="120" r="10" fill="#2f5597"/>
    <circle cx="210" cy="120" r="10" fill="#2f5597"/>
    <circle cx="300" cy="120" r="10" fill="#c55a11"/>
    <circle cx="390" cy="120" r="10" fill="#2f5597"/>
    <circle cx="480" cy="120" r="10" fill="#2f5597"/>
    <circle cx="570" cy="120" r="10" fill="#c55a11"/>
    <circle cx="660" cy="120" r="10" fill="#2f5597"/>
    <circle cx="750" cy="120" r="10" fill="#2f5597"/>
    <circle cx="840" cy="120" r="10" fill="#c55a11"/>
  </g>
  <text x="120" y="150" text-anchor="middle" font-size="10" fill="#5a6b7b">log</text>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#5a6b7b">sensor</text>
  <text x="570" y="150" text-anchor="middle" font-size="10" fill="#5a6b7b">news</text>
  <text x="840" y="150" text-anchor="middle" font-size="10" fill="#5a6b7b">tick</text>

  <!-- Windows -->
  <rect x="170" y="175" width="200" height="56" rx="6" fill="#dbe5f1" stroke="#2f5597" stroke-dasharray="6,4"/>
  <text x="270" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5597">Window A (5 min)</text>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#5a6b7b">count, aggregate, alert</text>

  <rect x="430" y="175" width="200" height="56" rx="6" fill="#fbe5d6" stroke="#c55a11" stroke-dasharray="6,4"/>
  <text x="530" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c55a11">Window B (5 min)</text>
  <text x="530" y="218" text-anchor="middle" font-size="11" fill="#5a6b7b">rolling metrics</text>

  <rect x="690" y="175" width="170" height="56" rx="6" fill="#e2efda" stroke="#548235" stroke-dasharray="6,4"/>
  <text x="775" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#548235">Window C</text>
  <text x="775" y="218" text-anchor="middle" font-size="11" fill="#5a6b7b">next slice</text>

  <!-- Processing engine -->
  <rect x="250" y="270" width="420" height="72" rx="8" fill="#efe8f5" stroke="#7030a0" stroke-width="2"/>
  <text x="460" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#7030a0">Stream processor</text>
  <text x="460" y="322" text-anchor="middle" font-size="12" fill="#5a6b7b">Kafka + Flink / Spark Streaming / Bytewax</text>

  <g stroke="#5a6b7b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="270" y1="231" x2="340" y2="268"/>
    <line x1="530" y1="231" x2="460" y2="268"/>
    <line x1="775" y1="231" x2="580" y2="268"/>
  </g>

  <!-- Outputs -->
  <rect x="120" y="380" width="200" height="52" rx="6" fill="#e2efda" stroke="#548235"/>
  <text x="220" y="412" text-anchor="middle" font-size="12" fill="#1f2d3d">Live dashboard</text>

  <rect x="360" y="380" width="200" height="52" rx="6" fill="#e2efda" stroke="#548235"/>
  <text x="460" y="412" text-anchor="middle" font-size="12" fill="#1f2d3d">Alerts / monitors</text>

  <rect x="600" y="380" width="200" height="52" rx="6" fill="#e2efda" stroke="#548235"/>
  <text x="700" y="412" text-anchor="middle" font-size="12" fill="#1f2d3d">Document store</text>

  <g stroke="#548235" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="360" y1="342" x2="220" y2="378"/>
    <line x1="460" y1="342" x2="460" y2="378"/>
    <line x1="560" y1="342" x2="700" y2="378"/>
  </g>

  <text x="460" y="452" text-anchor="middle" font-size="14" fill="#5a6b7b">Process events as they arrive. Results over time windows.</text>
</svg>
