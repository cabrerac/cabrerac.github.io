name: Build publications

on:
  push:
    branches:
      - gh-pages
    paths:
      - _data/publications.yml
      - scripts/publications/**
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml==6.0.1

      - name: Sync new works from ORCID
        run: python scripts/publications/sync_orcid.py

      - name: Build BibTeX from publications.yml
        run: python scripts/publications/build.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync publications from ORCID and rebuild bib"
          file_pattern: assets/bibs/bibfile.bib _data/publications.yml
